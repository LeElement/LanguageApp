],"su":["que je parle","que tu parles","qu'il parle","qu'on parle","que vous parliez","qu'ils parlent"],"fs":["je parlerai","tu parlerai","il parlera","on parlera","vous parlerez","ils parleront"],"pq":["j'avais parlé","tu avais parlé","il avait parlé","on avait parlé","vous aviez parlé","ils avaient parlé"]}},{"inf":"finir","en":"to finish","note":"MODÈLE -IR. Attention au -iss- au pluriel et à l'imparfait. Même schéma pour choisir, réussir, remplir, grandir, réfléchir, obéir, punir, ralentir, applaudir, atterrir.","t":{"pr":["je finis","tu finis","il finit","on finit","vous finissez","ils finissent"],"pc":["j'ai fini","tu as fini","il a fini","on a fini","vous avez fini","ils ont fini"],"im":["je finissais","tu finissais","il finissait","on finissait","vous finissiez","ils finissaient"],"fp":["je vais finir","tu vas finir","il va finir","on va finir","vous allez finir","ils vont finir"],"co":["je finirais","tu finirais","il finirait","on finirait","vous finiriez","ils finiraient"],"su":["que je finisse","que tu finisses","qu'il finisse","qu'on finisse","que vous finissiez","qu'ils finissent"],"fs":["je finirai","tu finirai","il finira","on finira","vous finirez","ils finiront"],"pq":["j'avais fini","tu avais fini","il avait fini","on avait fini","vous aviez fini","ils avaient fini"]}},{"inf":"vendre","en":"to sell","note":"MODÈLE -RE. La forme il n'a aucune terminaison : il vend. Même schéma pour attendre, entendre, répondre, perdre, descendre, rendre, défendre, mordre, tondre, confondre.","t":{"pr":["je vends","tu vends","il vend","on vend","vous vendez","ils vendent"],"pc":["j'ai vendu","tu as vendu","il a vendu","on a vendu","vous avez vendu","ils ont vendu"],"im":["je vendais","tu vendais","il vendait","on vendait","vous vendiez","ils vendaient"],"fp":["je vais vendre","tu vas vendre","il va vendre","on va vendre","vous allez vendre","ils vont vendre"],"co":["je vendrais","tu vendrais","il vendrait","on vendrait","vous vendriez","ils vendraient"],"su":["que je vende","que tu vendes","qu'il vende","qu'on vende","que vous vendiez","qu'ils vendent"],"fs":["je vendrai","tu vendrai","il vendra","on vendra","vous vendrez","ils vendront"],"pq":["j'avais vendu","tu avais vendu","il avait vendu","on avait vendu","vous aviez vendu","ils avaient vendu"]}},{"inf":"se lever","en":"to get up","note":"MODÈLE réfléchi. Le passé composé prend ÊTRE et le participe s'accorde : on s'est levés. Accent grave quand la terminaison est muette : je me lève.","t":{"pr":["je me lève","tu te lèves","il se lève","on se lève","vous vous levez","ils se lèvent"],"pc":["je me suis levé","tu t'es levé","il s'est levé","on s'est levés","vous vous êtes levés","ils se sont levés"],"im":["je me levais","tu te levais","il se levait","on se levait","vous vous leviez","ils se levaient"],"fp":["je vais me lever","tu vas te lever","il va se lever","on va se lever","vous allez vous lever","ils vont se lever"],"co":["je me lèverais","tu te lèverais","il se lèverait","on se lèverait","vous vous lèveriez","ils se lèveraient"],"su":["que je me lève","que tu te lèves","qu'il se lève","qu'on se lève","que vous vous leviez","qu'ils se lèvent"],"fs":["je me lèverai","tu te lèverai","il se lèvera","on se lèvera","vous vous lèverez","ils se lèveront"],"pq":["je m'étais levé","tu t'étais levé","il s'était levé","on s'était levés","vous vous étiez levés","ils s'étaient levés"]}},{"inf":"se casser","en":"to bounce / clear off","note":"Réfléchi et très familier : je me casse = I'm out. Même forme que se barrer, se tirer, se péter, se taper.","t":{"pr":["je me casse","tu te casses","il se casse","on se casse","vous vous cassez","ils se cassent"],"pc":["je me suis cassé","tu t'es cassé","il s'est cassé","on s'est cassés","vous vous êtes cassés","ils se sont cassés"],"im":["je me cassais","tu te cassais","il se cassait","on se cassait","vous vous cassiez","ils se cassaient"],"fp":["je vais me casser","tu vas te casser","il va se casser","on va se casser","vous allez vous casser","ils vont se casser"],"co":["je me casserais","tu te casserais","il se casserait","on se casserait","vous vous casseriez","ils se casseraient"],"su":["que je me casse","que tu te casses","qu'il se casse","qu'on se casse","que vous vous cassiez","qu'ils se cassent"],"fs":["je me casserai","tu te casserai","il se cassera","on se cassera","vous vous casserez","ils se casseront"],"pq":["je m'étais cassé","tu t'étais cassé","il s'était cassé","on s'était cassés","vous vous étiez cassés","ils s'étaient cassés"]}},{"inf":"boire","en":"to drink","note":"on boit un coup ? = shall we get a drink? Stem changes: bois / buvez / boivent.","t":{"pr":["je bois","tu bois","il boit","on boit","vous buvez","ils boivent"],"pc":["j'ai bu","tu as bu","il a bu","on a bu","vous avez bu","ils ont bu"],"im":["je buvais","tu buvais","il buvait","on buvait","vous buviez","ils buvaient"],"fp":["je vais boire","tu vas boire","il va boire","on va boire","vous allez boire","ils vont boire"],"co":["je boirais","tu boirais","il boirait","on boirait","vous boiriez","ils boiraient"],"su":["que je boive","que tu boives","qu'il boive","qu'on boive","que vous buviez","qu'ils boivent"],"fs":["je boirai","tu boirai","il boira","on boira","vous boirez","ils boiront"],"pq":["j'avais bu","tu avais bu","il avait bu","on avait bu","vous aviez bu","ils avaient bu"]}},{"inf":"sortir","en":"to go out","note":"Passé composé avec ÊTRE : on est sortis hier. Avec un complément d'objet direct ça bascule sur avoir : j'ai sorti la poubelle.","t":{"pr":["je sors","tu sors","il sort","on sort","vous sortez","ils sortent"],"pc":["je suis sorti","tu es sorti","il est sorti","on est sortis","vous êtes sortis","ils sont sortis"],"im":["je sortais","tu sortais","il sortait","on sortait","vous sortiez","ils sortaient"],"fp":["je vais sortir","tu vas sortir","il va sortir","on va sortir","vous allez sortir","ils vont sortir"],"co":["je sortirais","tu sortirais","il sortirait","on sortirait","vous sortiriez","ils sortiraient"],"su":["que je sorte","que tu sortes","qu'il sorte","qu'on sorte","que vous sortiez","qu'ils sortent"],"fs":["je sortirai","tu sortirai","il sortira","on sortira","vous sortirez","ils sortiront"],"pq":["j'étais sorti","tu étais sorti","il était sorti","on était sortis","vous étiez sortis","ils étaient sortis"]}},{"inf":"dormir","en":"to sleep","note":"j'ai mal dormi = I slept badly. Same shape as partir and sortir.","t":{"pr":["je dors","tu dors","il dort","on dort","vous dormez","ils dorment"],"pc":["j'ai dormi","tu as dormi","il a dormi","on a dormi","vous avez dormi","ils ont dormi"],"im":["je dormais","tu dormais","il dormait","on dormait","vous dormiez","ils dormaient"],"fp":["je vais dormir","tu vas dormir","il va dormir","on va dormir","vous allez dormir","ils vont dormir"],"co":["je dormirais","tu dormirais","il dormirait","on dormirait","vous dormiriez","ils dormiraient"],"su":["que je dorme","que tu dormes","qu'il dorme","qu'on dorme","que vous dormiez","qu'ils dorment"],"fs":["je dormirai","tu dormirai","il dormira","on dormira","vous dormirez","ils dormiront"],"pq":["j'avais dormi","tu avais dormi","il avait dormi","on avait dormi","vous aviez dormi","ils avaient dormi"]}},{"inf":"écrire","en":"to write","note":"Participe irrégulier : écrit. Même famille que décrire et inscrire.","t":{"pr":["j'écris","tu écris","il écrit","on écrit","vous écrivez","ils écrivent"],"pc":["j'ai écrit","tu as écrit","il a écrit","on a écrit","vous avez écrit","ils ont écrit"],"im":["j'écrivais","tu écrivais","il écrivait","on écrivait","vous écriviez","ils écrivaient"],"fp":["je vais écrire","tu vas écrire","il va écrire","on va écrire","vous allez écrire","ils vont écrire"],"co":["j'écrirais","tu écrirais","il écrirait","on écrirait","vous écririez","ils écriraient"],"su":["que j'écrive","que tu écrives","qu'il écrive","qu'on écrive","que vous écriviez","qu'ils écrivent"],"fs":["j'écrirai","tu écrirai","il écrira","on écrira","vous écrirez","ils écriront"],"pq":["j'avais écrit","tu avais écrit","il avait écrit","on avait écrit","vous aviez écrit","ils avaient écrit"]}},{"inf":"lire","en":"to read","note":"Participe : lu. j'ai rien lu = I didn't read anything.","t":{"pr":["je lis","tu lis","il lit","on lit","vous lisez","ils lisent"],"pc":["j'ai lu","tu as lu","il a lu","on a lu","vous avez lu","ils ont lu"],"im":["je lisais","tu lisais","il lisait","on lisait","vous lisiez","ils lisaient"],"fp":["je vais lire","tu vas lire","il va lire","on va lire","vous allez lire","ils vont lire"],"co":["je lirais","tu lirais","il lirait","on lirait","vous liriez","ils liraient"],"su":["que je lise","que tu lises","qu'il lise","qu'on lise","que vous lisiez","qu'ils lisent"],"fs":["je lirai","tu lirai","il lira","on lira","vous lirez","ils liront"],"pq":["j'avais lu","tu avais lu","il avait lu","on avait lu","vous aviez lu","ils avaient lu"]}},{"inf":"connaître","en":"to know (people, places)","note":"People, places, works. Facts and how-to take savoir instead. je connais pas = never heard of it.","t":{"pr":["je connais","tu connais","il connaît","on connaît","vous connaissez","ils connaissent"],"pc":["j'ai connu","tu as connu","il a connu","on a connu","vous avez connu","ils ont connu"],"im":["je connaissais","tu connaissais","il connaissait","on connaissait","vous connaissiez","ils connaissaient"],"fp":["je vais connaître","tu vas connaître","il va connaître","on va connaître","vous allez connaître","ils vont connaître"],"co":["je connaîtrais","tu connaîtrais","il connaîtrait","on connaîtrait","vous connaîtriez","ils connaîtraient"],"su":["que je connaisse","que tu connaisses","qu'il connaisse","qu'on connaisse","que vous connaissiez","qu'ils connaissent"],"fs":["je connaîtrai","tu connaîtrai","il connaîtra","on connaîtra","vous connaîtrez","ils connaîtront"],"pq":["j'avais connu","tu avais connu","il avait connu","on avait connu","vous aviez connu","ils avaient connu"]}},{"inf":"attendre","en":"to wait","note":"Follows the vendre model. No preposition: j'attends le bus, not pour le bus.","t":{"pr":["j'attends","tu attends","il attend","on attend","vous attendez","ils attendent"],"pc":["j'ai attendu","tu as attendu","il a attendu","on a attendu","vous avez attendu","ils ont attendu"],"im":["j'attendais","tu attendais","il attendait","on attendait","vous attendiez","ils attendaient"],"fp":["je vais attendre","tu vas attendre","il va attendre","on va attendre","vous allez attendre","ils vont attendre"],"co":["j'attendrais","tu attendrais","il attendrait","on attendrait","vous attendriez","ils attendraient"],"su":["que j'attende","que tu attendes","qu'il attende","qu'on attende","que vous attendiez","qu'ils attendent"],"fs":["j'attendrai","tu attendrai","il attendra","on attendra","vous attendrez","ils attendront"],"pq":["j'avais attendu","tu avais attendu","il avait attendu","on avait attendu","vous aviez attendu","ils avaient attendu"]}},{"inf":"ouvrir","en":"to open","note":"An -IR verb with -ER endings in the present: j'ouvre. Participe : ouvert. Same for offrir, couvrir, souffrir.","t":{"pr":["j'ouvre","tu ouvres","il ouvre","on ouvre","vous ouvrez","ils ouvrent"],"pc":["j'ai ouvert","tu as ouvert","il a ouvert","on a ouvert","vous avez ouvert","ils ont ouvert"],"im":["j'ouvrais","tu ouvrais","il ouvrait","on ouvrait","vous ouvriez","ils ouvraient"],"fp":["je vais ouvrir","tu vas ouvrir","il va ouvrir","on va ouvrir","vous allez ouvrir","ils vont ouvrir"],"co":["j'ouvrirais","tu ouvrirais","il ouvrirait","on ouvrirait","vous ouvririez","ils ouvriraient"],"su":["que j'ouvre","que tu ouvres","qu'il ouvre","qu'on ouvre","que vous ouvriez","qu'ils ouvrent"],"fs":["j'ouvrirai","tu ouvrirai","il ouvrira","on ouvrira","vous ouvrirez","ils ouvriront"],"pq":["j'avais ouvert","tu avais ouvert","il avait ouvert","on avait ouvert","vous aviez ouvert","ils avaient ouvert"]}},{"inf":"croire","en":"to believe / think","note":"je crois pas = I don't think so. Very common as a hedge, like je pense.","t":{"pr":["je crois","tu crois","il croit","on croit","vous croyez","ils croient"],"pc":["j'ai cru","tu as cru","il a cru","on a cru","vous avez cru","ils ont cru"],"im":["je croyais","tu croyais","il croyait","on croyait","vous croyiez","ils croyaient"],"fp":["je vais croire","tu vas croire","il va croire","on va croire","vous allez croire","ils vont croire"],"co":["je croirais","tu croirais","il croirait","on croirait","vous croiriez","ils croiraient"],"su":["que je croie","que tu croies","qu'il croie","qu'on croie","que vous croyiez","qu'ils croient"],"fs":["je croirai","tu croirai","il croira","on croira","vous croirez","ils croiront"],"pq":["j'avais cru","tu avais cru","il avait cru","on avait cru","vous aviez cru","ils avaient cru"]}},{"inf":"falloir","en":"to be necessary / must","note":"Défectif : il faut seulement, jamais conjugué à une autre personne. il faut que + subjonctif, et à l'oral le il saute : faut qu'on y aille.","t":{"pr":["","","il faut","","",""],"pc":["","","il a fallu","","",""],"im":["","","il fallait","","",""],"fp":["","","il va falloir","","",""],"co":["","","il faudrait","","",""],"su":["","","qu'il faille","","",""],"fs":["","","il faudra","","",""],"pq":["","","il avait fallu","","",""]}}],"tenses":[{"k":"pr","label":"Présent","hint":"what you do now — 'je bosse'"},{"k":"pc","label":"Passé composé","hint":"what you DID — 'j'ai bossé'"},{"k":"im","label":"Imparfait","hint":"what you WERE doing / used to — 'je bossais'"},{"k":"pq","label":"Plus-que-parfait","hint":"had done — a past before the past — 'j'avais fait'"},{"k":"fp","label":"Futur proche","hint":"what you're GOING to do — 'je vais bosser'"},{"k":"fs","label":"Futur simple","hint":"will — mostly written; in speech you say 'je vais faire'"},{"k":"co","label":"Conditionnel","hint":"would — politeness & hypotheticals — 'je voudrais'"},{"k":"su","label":"Subjonctif","hint":"after 'il faut que', 'je veux que' — 'faut que j'y aille'"}],"rules":[{"t":"Imparfait vs Passé composé","sub":"The #1 past-tense mistake","body":[{"h":"Passé composé = a completed ACTION","p":"Something that happened once, done, finished. It moves the story forward.","ex":["J'ai soudé une carte.","On est sortis hier soir.","Il a marqué un but."]},{"h":"Imparfait = the BACKGROUND","p":"What was ongoing, what used to happen, descriptions, states, feelings. It sets the scene.","ex":["Je bossais quand il a appelé.","Avant, je jouais au foot tous les jours.","Il faisait beau, j'étais crevé."]},{"h":"The test","p":"Ask: is it a snapshot (PC) or a movie playing in the background (imparfait)? 'J'étais dans le labo (background) quand ça a grillé (action).'","ex":["J'étais à la salle quand tu m'as appelé."]}]},{"t":"L'ordre des pronoms","sub":"Where they go, and in what order","body":[{"h":"They go BEFORE the verb","p":"Not after, like English. 'I see it' → 'je LE vois'.","ex":["Je le vois.","Je lui parle.","J'y vais.","J'en veux."]},{"h":"The order when you stack them","p":"me / te / nous  →  le / la / les  →  lui / leur  →  y  →  en","ex":["Je te le donne.","Je le lui donne.","Il y en a."]},{"h":"Imperative flips it","p":"In a command, the pronoun goes AFTER and 'me' becomes 'moi'.","ex":["Donne-le-moi.","Dis-moi.","Vas-y."]}]},{"t":"Le subjonctif","sub":"Not scary — you only need the triggers","body":[{"h":"After 'il faut que'","p":"This alone covers most daily use. 'Faut que j'y aille' = I gotta go.","ex":["Faut que j'y aille.","Il faut que je fasse mes devoirs.","Faut qu'on se voie."]},{"h":"After wanting / feeling","p":"je veux que, j'aimerais que, je suis content que, j'ai peur que","ex":["Je veux que tu viennes.","J'aimerais qu'il soit là."]},{"h":"After certain conjunctions","p":"bien que, avant que, pour que, jusqu'à ce que","ex":["Bien que ce soit chaud.","Pour que tu comprennes."]},{"h":"NOT after 'je pense que'","p":"Positive opinion = indicative. 'Je pense qu'il EST là.' But negative/doubt takes subjunctive: 'je pense pas qu'il soit là.'","ex":["Je pense qu'il est là.","Je pense pas qu'il soit là."]}]},{"t":"Le conditionnel","sub":"Politeness + hypotheticals","body":[{"h":"Politeness — use it constantly","p":"'Je veux un café' sounds rude. 'Je voudrais' is what you say.","ex":["Je voudrais un café.","Je pourrais avoir l'addition ?","Tu pourrais m'aider ?"]},{"h":"Hypotheticals: si + imparfait → conditionnel","p":"'If I were… I would…'","ex":["Si j'étais toi, je le ferais.","Si j'avais le temps, je viendrais."]},{"h":"Never 'si' + conditionnel","p":"'Si je serais' is WRONG — the classic error. It's 'si j'étais'.","ex":["Si j'étais riche…"]}]},{"t":"La négation à l'oral","sub":"The 'ne' disappears","body":[{"h":"Spoken French drops 'ne'","p":"Nobody says 'je ne sais pas'. They say 'j'sais pas' / 'chais pas'.","ex":["Je sais pas.","J'ai rien fait.","Y a personne."]},{"h":"But keep the second word","p":"pas / plus / jamais / rien / personne / que — that's what carries the meaning.","ex":["J'ai plus de thune.","Je fais jamais ça.","J'ai que dix euros."]},{"h":"'Ne… que' means ONLY","p":"It looks like a negation but isn't. 'J'ai que dix euros' = I only have ten.","ex":["Il y a que toi."]}]},{"t":"Prononciation","sub":"Liaison, nasals, and the R","body":[{"h":"Liaison — link the words","p":"A silent final consonant wakes up before a vowel. 'les amis' → 'lay-zah-mee'. 'vous êtes' → 'voo-zet'.","ex":["Les amis","Vous êtes","On y va","J'en ai"]},{"h":"Never liaise after 'et'","p":"'et alors' is NEVER 'ay-talor'. The 't' in 'et' is always silent.","ex":["Et alors ?"]},{"h":"Nasal vowels","p":"an/en = 'on'. in/ain = 'an'. on = 'on' (rounder). un = 'uh'. Air goes through the nose; don't pronounce the N.","ex":["Un bon vin blanc"]},{"h":"The French R","p":"It's in the throat, not the tongue. Like a soft gargle where 'h' would be. Practise on 'Paris', 'rouge', 'RER'.","ex":["Paris","Le RER"]},{"h":"Final consonants are silent","p":"Usually. 'petit' → 'ptee'. 'beaucoup' → 'boh-koo'. But C, R, F, L often survive (CaReFuL).","ex":["Petit","Beaucoup"]}]},{"t":"Les verbes réfléchis","sub":"se casser, se barrer, se rendre compte","body":[{"h":"The pronoun changes with the subject","p":"me / te / se / se / vous / se, always right before the verb. In familier they are everywhere: se casser, se barrer, se péter, se taper, s'en foutre.","ex":["Je me casse.","Tu te barres déjà ?","On se voit demain.","Je m'en fous."]},{"h":"Passé composé always takes ÊTRE","p":"Never avoir. Even for verbs that take avoir normally: j'ai cassé mon téléphone, but je me suis cassé.","ex":["Je me suis levé tôt.","On s'est barrés avant la fin.","Il s'est rendu compte trop tard."]},{"h":"And the participle agrees with the subject","p":"on takes a plural s in the familier sense of we: on s'est cassés. Watch the exception: with a body part the participle stays flat because the body part is the object.","ex":["On s'est vus hier.","Je me suis cassé le bras.","Ils se sont tirés."]},{"h":"Negation wraps the pronoun too","p":"The pas goes after the verb, and the reflexive pronoun stays glued to it.","ex":["Je me casse pas.","On s'est pas vus.","Il se rend pas compte."]}]},{"t":"Verbes + à / de + infinitif","sub":"which verbs take à, which take de — and which take nothing","body":[{"h":"There is no rule — it's a memorised list","p":"When you stack two verbs, the second stays in the infinitive. The trap is the little word in between: some verbs demand à, some demand de, some take nothing. You just have to learn each one.","ex":["Je commence à comprendre.","J'essaie de parler français.","Je veux partir."]},{"h":"The à group","p":"commencer à, se mettre à (to start), réussir à (to manage), arriver à (to succeed in), continuer à, apprendre à, hésiter à, penser à.","ex":["J'arrive pas à dormir.","Il s'est mis à pleuvoir.","J'apprends à conduire."]},{"h":"The de group","p":"essayer de, arrêter de (to stop), oublier de, décider de, finir de, venir de (to have just), rêver de, avoir envie de (to feel like), avoir besoin de.","ex":["Arrête de faire ça.","J'ai oublié de t'appeler.","Je viens de finir."]},{"h":"The no-preposition group","p":"After vouloir, pouvoir, devoir, aller, savoir, aimer, détester, espérer — the infinitive follows directly, with nothing between.","ex":["Je veux y aller.","Tu sais nager ?","J'aime bien traîner."]},{"h":"Same verb, different meaning","p":"A few flip meaning with the preposition. venir à = to happen to; venir de = to have just. décider de = to decide to; se décider à = to make up your mind.","ex":["Je viens de manger.","Il vient d'arriver."]}]},{"t":"L'impératif","sub":"vas-y, arrête, laisse tomber","body":[{"h":"Three forms only: tu, nous, vous","p":"Take the present and drop the subject pronoun. That's it.","ex":["Arrête.","Écoute.","Attendez.","Allons-y."]},{"h":"-ER verbs lose the S in the tu form","p":"tu parles becomes parle. Same for va, from tu vas.","ex":["Parle plus fort.","Regarde ça.","Va au bout de la rue."]},{"h":"Except before y and en","p":"The S comes back so the liaison works: vas-y, not va-y.","ex":["Vas-y.","Manges-en.","Penses-y."]},{"h":"Pronouns flip to the back, and me becomes moi","p":"In a command the pronoun follows the verb with a hyphen, and the reflexive uses the stressed form.","ex":["Dis-moi.","Lève-toi.","Casse-toi.","Donne-le-moi."]},{"h":"Negative imperative puts them back in front","p":"The flip only happens in the positive. In the negative the normal order returns.","ex":["Te casse pas.","Me dis pas ça.","T'inquiète pas."]}]},{"t":"Le partitif et la négation","sub":"du, de la, des — and how they collapse","body":[{"h":"Some of an uncountable thing","p":"du (masc), de la (fem), de l' (before a vowel), des (plural). English usually says nothing at all, French never omits it.","ex":["Je veux du pain.","Il boit de la bière.","J'ai de l'argent.","On a des potes là-bas."]},{"h":"After a negation they ALL become bare de","p":"This is one of the loudest non-native tells. pas du pain is wrong; it is pas de pain.","ex":["J'ai pas de thune.","Y a pas de pain.","Il boit pas de bière.","On a plus de temps."]},{"h":"The exception: être","p":"After c'est / ce n'est pas the article survives, because être identifies rather than quantifies.","ex":["C'est pas du café.","C'est pas de la blague."]},{"h":"Quantity words also take bare de","p":"beaucoup de, un peu de, trop de, assez de, plein de — never du or des after them.","ex":["J'ai beaucoup de taf.","Un peu de patience.","Plein de monde."]}]},{"t":"Poser une question","sub":"the three registers, and the one you actually use","body":[{"h":"1. Intonation — the normal one","p":"Same word order as a statement, voice goes up at the end. This is what people actually say.","ex":["Tu viens ?","Ça te dit ?","Il est là ?"]},{"h":"2. Est-ce que — neutral, always safe","p":"Bolt it on the front, change nothing else. Slightly heavier but never wrong.","ex":["Est-ce que tu viens ?","Est-ce qu'il est là ?"]},{"h":"3. Inversion — formal and mostly written","p":"Fine in an email to a client. In a bar it sounds like a costume.","ex":["Viens-tu ?","Pouvez-vous m'aider ?"]},{"h":"Question words go at the END in speech","p":"The textbook fronts them; spoken French leaves them where the answer would go.","ex":["Tu fais quoi ?","Tu vas où ?","C'est qui ?","On part quand ?","Tu fais ça comment ?"]},{"h":"quoi vs que vs qu'est-ce que","p":"Same question, three registers: tu fais quoi (spoken), qu'est-ce que tu fais (neutral), que fais-tu (formal).","ex":["Tu fais quoi ?","Qu'est-ce que tu fais ?","Que fais-tu ?"]}]},{"t":"L'accord du participe passé","sub":"when the past participle grows an E or an S","body":[{"h":"With ÊTRE: agrees with the subject","p":"aller, venir, partir, sortir, rester, tomber, naître, mourir and the rest of the être list.","ex":["Elle est allée au taf.","On est sortis hier.","Ils sont partis tôt."]},{"h":"With AVOIR: no agreement — unless the object comes first","p":"j'ai fait la carte, no agreement. But move the object in front with que or a pronoun and it agrees.","ex":["J'ai fait la carte.","La carte que j'ai soudée.","Je les ai vus."]},{"h":"Reflexives follow the ÊTRE rule","p":"Because they take être. Body-part objects are the exception, since the object then follows the verb.","ex":["On s'est vus.","Elle s'est levée.","Je me suis cassé la jambe."]},{"h":"It is mostly silent","p":"soudé and soudée sound identical. It matters when you write, and in the handful of participles with an audible consonant: fait / faite, mis / mise.","ex":["La carte est faite.","La table est mise."]}]},{"t":"Y et EN","sub":"the two little words that replace whole phrases","body":[{"h":"Y replaces à + a thing or a place","p":"Never a person. For people you use lui or leur.","ex":["J'y vais.","On y était hier.","J'y pense.","Vas-y."]},{"h":"EN replaces de + a thing, or a quantity","p":"It also carries the number: j'en veux deux.","ex":["J'en ai marre.","J'en veux deux.","Il y en a.","J'en reviens pas."]},{"h":"They keep their slot in the stack","p":"me / te / nous, then le / la / les, then lui / leur, then y, then en. y and en are always last.","ex":["Il y en a.","Je t'en parle.","Donne-m'en."]},{"h":"Frozen expressions worth memorising whole","p":"These come up daily and are not worth analysing.","ex":["J'en ai marre.","Je m'en fous.","Ça y est.","On y va.","Il s'en sort bien."]}]},{"t":"Futur simple vs futur proche","sub":"je ferai vs je vais faire","body":[{"h":"Spoken French overwhelmingly uses futur proche","p":"aller + infinitif. If you are talking, this is your default and it never sounds wrong.","ex":["Je vais le faire.","On va se voir demain.","Ça va marcher."]},{"h":"Futur simple is written, distant, or formal","p":"Reports, plans, weather, contracts. You will read and hear it constantly even if you rarely produce it.","ex":["Je te rappellerai.","On verra bien.","Il fera beau demain."]},{"h":"Same stem as the conditionnel","p":"If you know je ferais, you know je ferai. Only the ending changes: -ai, -as, -a, -a, -ez, -ont.","ex":["Je ferai ça demain.","Tu verras.","Ils viendront."]},{"h":"After quand, French uses the future where English uses the present","p":"quand il arrivera, not quand il arrive. Same for dès que and lorsque.","ex":["Quand il arrivera, on partira.","Dès que j'aurai fini."]}]},{"t":"Les adjectifs","sub":"agreement, placement, and the ones that don't budge","body":[{"h":"Default position is AFTER the noun","p":"The opposite of English. un projet chaud, not un chaud projet.","ex":["Un projet chaud.","Une soirée sympa.","Un truc chelou."]},{"h":"BAGS adjectives go BEFORE","p":"Beauty, Age, Goodness, Size: beau, joli, jeune, vieux, nouveau, bon, mauvais, grand, petit, gros.","ex":["Un vieux pote.","Une bonne idée.","Un petit café.","Un nouveau taf."]},{"h":"Irregular feminines to memorise","p":"beau / belle, vieux / vieille, nouveau / nouvelle, fou / folle, and the special masculine before a vowel: un bel appart, un vieil ami.","ex":["Une belle carte.","Une vieille bagnole.","Un bel appart."]},{"h":"Slang adjectives never agree","p":"sympa, cool, top, nickel, chelou (chelou does take an e in careful writing, but nobody says it). They stay flat in every gender and number.","ex":["Elle est sympa.","C'est nickel.","Ils sont cool.","Une soirée top."]}]},{"t":"C'est vs il est","sub":"the split that trips up every learner","body":[{"h":"C'EST + article + noun","p":"If there is un, une, le, la, mon, ton in front of the noun, it is c'est. Always.","ex":["C'est un ingé.","C'est mon pote.","C'est une bonne idée."]},{"h":"IL EST + bare profession or nationality","p":"No article at all. Drop the article and you must switch to il est.","ex":["Il est ingénieur.","Elle est française.","Il est étudiant."]},{"h":"C'EST for a situation, IL EST for a person","p":"c'est chaud judges the situation; il est crevé describes the guy.","ex":["C'est chaud.","Il est crevé.","C'est nul.","Elle est cool."]},{"h":"The plural of c'est is ce sont — but nobody says it","p":"In speech c'est covers the plural too. Keep ce sont for writing.","ex":["C'est mes potes.","Ce sont mes collègues."]}]},{"t":"Depuis, il y a, pendant","sub":"three ways to talk about time, and only one is intuitive","body":[{"h":"DEPUIS + PRESENT for something still going","p":"This is the big one. English says I have been here for two years; French uses the PRESENT tense, because you are still there. Saying j'ai été là depuis deux ans is wrong.","ex":["Je suis là depuis deux ans.","Je bosse ici depuis janvier.","On attend depuis une heure."]},{"h":"IL Y A = a point in the past","p":"How long ago it happened. Always with a past tense. Not to be confused with il y a meaning there is.","ex":["Je suis arrivé il y a deux ans.","Il a appelé il y a cinq minutes.","On s'est vus il y a longtemps."]},{"h":"PENDANT = a closed span, start and end both over","p":"The thing lasted that long and then stopped. Usually with the passé composé.","ex":["J'ai bossé là pendant deux ans.","On a attendu pendant une heure.","Il a dormi pendant tout le trajet."]},{"h":"The test","p":"Am I still doing it? depuis. Is it finished and I want to say how long ago it started? il y a. Is it finished and I want to say how long it lasted? pendant.","ex":["Je suis là depuis deux ans.","Je suis arrivé il y a deux ans.","J'ai bossé là pendant deux ans."]}]},{"t":"Savoir vs connaître","sub":"both are to know, and they are not interchangeable","body":[{"h":"SAVOIR = facts, and how to do things","p":"Information you could state, or a skill. Takes que, si, où, quand, pourquoi, or a bare infinitive.","ex":["Je sais où il est.","Je sais souder.","Tu sais qu'il vient ?","Je sais pas."]},{"h":"CONNAÎTRE = people, places, and works","p":"Familiarity with a thing you have met or been to. Always takes a direct object, never a clause.","ex":["Je connais ce mec.","Tu connais Lyon ?","Je connais cette chanson."]},{"h":"The clean split","p":"You can never say je connais que… and you can never say je sais Paris. If a que follows, it is savoir. If a noun follows and it is a person or place, it is connaître.","ex":["Je sais qu'il est là.","Je connais son frère."]},{"h":"In the passé composé both change meaning","p":"j'ai su = I found out. j'ai connu = I met, for the first time.","ex":["J'ai su qu'il partait.","Je l'ai connu à la fac."]},{"h":"je sais pas is the most common phrase in French","p":"Spoken flat as chais pas or even chsais pas. Learn the reduction, you will hear it constantly.","ex":["Je sais pas.","Chais pas."]}]},{"t":"Le plus-que-parfait","sub":"the past before the past","body":[{"h":"Imparfait of the auxiliary + participle","p":"Take the passé composé and put avoir or être into the imparfait. That is the whole tense.","ex":["J'avais fait.","On était partis.","Il s'était cassé."]},{"h":"Use it when one past thing happened before another","p":"The plus-que-parfait is the earlier one; the passé composé or imparfait carries the main story.","ex":["Quand je suis arrivé, il était déjà parti.","J'avais pas compris ce qu'il voulait."]},{"h":"SI + plus-que-parfait → conditionnel passé","p":"The regret construction: if I had done X, I would have done Y. Both halves are compound, and si never takes a conditional.","ex":["Si j'avais su, je serais pas venu.","Si t'avais dit ça, j'aurais compris.","J'aurais dû le faire."]},{"h":"si j'aurais su is the famous mistake","p":"It is the line every French person quotes to mock bad grammar. It is si j'avais su.","ex":["Si j'avais su."]}]},{"t":"Bon vs bien","sub":"adjective vs adverb, and the trap","body":[{"h":"BON is an adjective — it describes a noun","p":"It agrees: bon, bonne, bons, bonnes. Quality, taste, a thing being good.","ex":["C'est un bon plan.","Une bonne idée.","Ce café est bon."]},{"h":"BIEN is an adverb — it describes a verb","p":"Never agrees, never changes. How well something is done.","ex":["Il bosse bien.","Ça marche bien.","J'ai bien dormi."]},{"h":"The trap: bien also works as an adjective meaning decent","p":"c'est bon = it tastes good, or that's enough. c'est bien = that's a good thing, well done.","ex":["C'est bon, arrête.","C'est bien, bravo.","C'est bon ça !"]},{"h":"meilleur vs mieux","p":"The comparatives split the same way: meilleur is the adjective, mieux is the adverb.","ex":["C'est meilleur.","Ça marche mieux.","Il est meilleur que moi."]}]},{"t":"On, nous, tu, vous","sub":"who you are talking to, and who you are talking as","body":[{"h":"ON replaces NOUS in speech — always","p":"Nobody says nous allons in conversation. This is why the tables in this app have no nous row: you will read it, you will barely say it.","ex":["On y va.","On s'est vus hier.","On va manger."]},{"h":"ON takes the IL form of the verb, but plural agreement","p":"The verb is singular, the adjective and participle go plural. on est content is one person; on est contents is us.","ex":["On est arrivés.","On est contents.","On s'est cassés."]},{"h":"ON also means people in general","p":"Same word, no ambiguity in practice — context sorts it out.","ex":["On dit que c'est chaud.","Ici on paie en espèces."]},{"h":"TU vs VOUS — the threshold","p":"VOUS for anyone older, any stranger, any shop or service, anyone at work above you. TU for friends, family, students, kids, and coworkers your age once they have tu-ed you first.","ex":["Vous pouvez m'aider ?","Tu peux m'aider ?","On peut se tutoyer ?"]},{"h":"Wait to be offered the tu","p":"Let the older or senior person switch first. Going to tu too early reads as presumptuous; staying on vous a bit long reads as merely polite. One is a mistake, the other is not.","ex":["On se tutoie ?","Je peux vous tutoyer ?"]}]}],"registre":[{"sit":"Un commerçant, un serveur, un inconnu","who":"Shopkeeper, waiter, stranger","rule":"VOUS. Always say bonjour first — skipping it is genuinely rude in France.","ok":["Bonjour, je voudrais un café, s'il vous plaît.","Excusez-moi, vous pouvez m'aider ?","Merci beaucoup, bonne journée !"],"no":["Wesh, file-moi un café.","Salut, tu peux m'aider ?"],"lvl":1},{"sit":"Ton boss, un prof, un client","who":"Boss, professor, client (think your internship)","rule":"VOUS, zero slang, zero swearing. This is where slang destroys you.","ok":["Bonjour, je pourrais avoir un point sur le projet ?","Je vais m'en occuper.","Excusez-moi, je n'ai pas compris."],"no":["Putain, ça marche pas.","C'est chelou ton truc.","J'ai la flemme."],"lvl":1},{"sit":"Un collègue de ton âge","who":"A coworker your age","rule":"TU once they tu you. Light slang OK, swearing still risky.","ok":["Ça va ? Tu bosses sur quoi ?","C'est chaud ce projet.","Je galère un peu là."],"no":["Ferme ta gueule.","T'es qu'un bouffon."],"lvl":2},{"sit":"Des potes, une soirée","who":"Friends, a party","rule":"TU, full slang, verlan, swearing fine among mates.","ok":["Wesh frérot, ça dit quoi ?","C'était chanmé cette teuf.","J'ai grave kiffé."],"no":["Je vous prie de m'excuser.","Puis-je avoir une bière ?"],"lvl":3},{"sit":"Les insultes lourdes","who":"The heavy insults","rule":"enculé, fils de pute, nique ta mère — these start fights. Understand them; don't say them.","ok":["(understand only)"],"no":["Nique ta mère.","Fils de pute.","Enculé."],"lvl":3}],"music":[{"grp":"Commence ici — le plus facile à comprendre","note":"Clear diction, conversational flow, packed with the slang you're learning.","tracks":[{"a":"Orelsan","t":"Basique","why":"Slow, hyper-clear, almost spoken. The best first French rap track for a learner.","lvl":1},{"a":"Orelsan","t":"Tout va bien","why":"Conversational storytelling — he raps the way people actually talk.","lvl":1},{"a":"Orelsan","t":"Notes pour trop tard","why":"A letter to his younger self. Slow, articulate, emotionally direct.","lvl":1},{"a":"Orelsan","t":"La terre est ronde","why":"Simple vocabulary, big themes. Easy to follow.","lvl":1},{"a":"Stromae","t":"Papaoutai","why":"Not rap, but perfect diction and a story about an absent father.","lvl":1},{"a":"Stromae","t":"Formidable","why":"Slurred on purpose — a drunk man. Great ear training once you know the words.","lvl":2}]},{"grp":"Love story & heartbreak","note":"What you asked for. Emotional storytelling, not flexing.","tracks":[{"a":"Orelsan & Stromae","t":"La pluie","why":"THE one. A love song disguised as reflection — rain as a metaphor for absence and distance.","lvl":2},{"a":"Ninho","t":"Lettre à une femme","why":"A letter to a woman. Vulnerable, melodic, the storytelling register you want.","lvl":2},{"a":"Dadju ft. Ninho","t":"Grand Bain","why":"Longing and doubt — would she still love him without the success? Diamond-certified.","lvl":2},{"a":"Gradur ft. Heuss l'Enfoiré","t":"Ne reviens pas","why":"Love lost, moving on. Hit #2 in France.","lvl":2},{"a":"Gims","t":"L'Amour Toujours","why":"Love, heartbreak, resilience — pop-rap crossover, very singable.","lvl":1},{"a":"Niro","t":"Sors de ma tête","why":"'Get out of my head.' Pure heartbreak.","lvl":2},{"a":"Soolking ft. Dadju","t":"Meleğim","why":"Tender, melodic, Algerian-French — hear the North African influence.","lvl":2}]},{"grp":"Introspection & récit","note":"Storytelling rap — narrative, past tenses, real vocabulary.","tracks":[{"a":"Nekfeu","t":"On verra","why":"Introspection mixed with hope. Dense but rewarding — a modern classic.","lvl":3},{"a":"Oxmo Puccino","t":"Quand je marchais seul","why":"Poetic lyricism, a personal story of loneliness. French rap as literature.","lvl":3},{"a":"IAM","t":"Demain c'est loin","why":"The all-time storytelling epic. Metaphor-heavy, 15 minutes, worth it.","lvl":3},{"a":"Sexion d'Assaut","t":"J'pète les plombs","why":"Mental health, honestly told. You already know the expression from the app.","lvl":2},{"a":"Kery James","t":"Lettre à la République","why":"Furious, articulate political rap. Every word lands.","lvl":3}]},{"grp":"La rue — le canon","note":"The foundational stuff. Harder: heavy verlan, thick slang, fast.","tracks":[{"a":"Suprême NTM","t":"Ma Benz","why":"Street slang and sharp wordplay — defined late-90s French rap.","lvl":3},{"a":"Booba","t":"92i Veyron","why":"Metaphor-dense trap. The most influential rapper in France.","lvl":3},{"a":"Lunatic (Booba & Ali)","t":"Le Crime Paie","why":"Dark, sparse, foundational gangsta rap.","lvl":3},{"a":"SCH","t":"Marché noir","why":"Cinematic, menacing, superb imagery.","lvl":3},{"a":"Damso","t":"Macarena","why":"Raw emotion, cryptic storytelling, minimalist beat.","lvl":3},{"a":"Sefyu","t":"Dans ma rue","why":"Life in the rough Paris streets, powerful delivery.","lvl":3}]},{"grp":"⚠️ Plus tard","note":"Brilliant, but terrible for learning right now — mumbled, autotuned, heavy verlan.","tracks":[{"a":"PNL","t":"Le monde ou rien","why":"Cloud rap, cinematic — but the delivery is cryptic and drowned in autotune.","lvl":3},{"a":"PNL","t":"Au DD","why":"Iconic. You will not understand a word for a long time. That's fine.","lvl":3}]}],"scenes":[{"id":"boulangerie","t":"À la boulangerie","en":"At the bakery","setup":"Morning rush, there's a line behind you.","lines":[{"s":"them","who":"Boulangère","fr":"Bonjour ! Je vous écoute.","en":"Hello! What can I get you?"},{"s":"you","cue":"Say hello and ask for a baguette","fr":"Bonjour ! Une baguette, s'il vous plaît.","alts":["Bonjour, je voudrais une baguette, s'il vous plaît","Bonjour, une baguette s'il vous plaît"]},{"s":"them","who":"Boulangère","fr":"Une tradition ou une classique ?","en":"A tradition or a regular one?"},{"s":"you","cue":"Say a tradition","fr":"Une tradition, s'il vous plaît.","alts":["Une tradition","Tradition, s'il vous plaît"]},{"s":"them","who":"Boulangère","fr":"Et avec ça ?","en":"Anything else?"},{"s":"you","cue":"Ask for two croissants as well","fr":"Et deux croissants, s'il vous plaît.","alts":["Deux croissants aussi, s'il vous plaît","Je vais prendre deux croissants aussi"]},{"s":"them","who":"Boulangère","fr":"Ce sera tout ?","en":"Will that be all?"},{"s":"you","cue":"Say yes, that's all","fr":"Oui, ce sera tout, merci.","alts":["Oui, c'est tout","C'est tout, merci"]},{"s":"them","who":"Boulangère","fr":"Alors, ça fait quatre euros dix.","en":"So that's four euros ten."},{"s":"you","cue":"Ask if you can pay by card","fr":"Je peux payer par carte ?","alts":["Je peux payer en carte ?","Par carte, c'est possible ?"]},{"s":"them","who":"Boulangère","fr":"Oui, allez-y, en sans contact. Bonne journée !","en":"Yes, go ahead, contactless. Have a nice day!"},{"s":"you","cue":"Thank her and wish her a good day too","fr":"Merci, vous aussi, bonne journée !","alts":["Merci, vous aussi !","Merci, bonne journée !"]}]},{"id":"terrasse","t":"En terrasse","en":"At a café terrace","setup":"You sit down outside a café. The waiter comes over.","lines":[{"s":"them","who":"Serveur","fr":"Bonjour, vous avez choisi ?","en":"Hello, have you decided?"},{"s":"you","cue":"Order an espresso and a sparkling water","fr":"Oui, un café et une eau gazeuse, s'il vous plaît.","alts":["Je vais prendre un café et une eau pétillante, s'il vous plaît","Un expresso et un Perrier, s'il vous plaît"]},{"s":"them","who":"Serveur","fr":"Une bouteille ou un verre ?","en":"A bottle or a glass?"},{"s":"you","cue":"Say just a glass","fr":"Juste un verre, s'il vous plaît.","alts":["Un verre, merci"]},{"s":"them","who":"Serveur","fr":"Très bien. Et avec ceci ?","en":"Very good. Anything else?"},{"s":"you","cue":"Say that's all for now","fr":"Ce sera tout pour l'instant, merci.","alts":["C'est tout pour le moment, merci","Non, c'est bon, merci"]},{"s":"them","who":"Serveur","fr":"Voilà, je vous laisse ça.","en":"Here you go, I'll leave that with you."},{"s":"you","cue":"A bit later: get his attention and ask for the bill","fr":"Excusez-moi, je pourrais avoir l'addition, s'il vous plaît ?","alts":["L'addition, s'il vous plaît","Excusez-moi, on peut avoir l'addition ?"]},{"s":"them","who":"Serveur","fr":"Bien sûr. Vous réglez comment ?","en":"Of course. How are you paying?"},{"s":"you","cue":"Say by card","fr":"Par carte, s'il vous plaît.","alts":["Par carte","En carte"]}]},{"id":"resto","t":"Au resto","en":"Dinner out","setup":"You walk into a restaurant with a friend. No reservation.","lines":[{"s":"them","who":"Serveuse","fr":"Bonsoir ! Vous avez réservé ?","en":"Good evening! Do you have a reservation?"},{"s":"you","cue":"Say no, you didn't book, there are two of you","fr":"Non, on a pas réservé. On est deux.","alts":["Non, on est deux","Non, pas de réservation, on est deux"]},{"s":"them","who":"Serveuse","fr":"En terrasse ou à l'intérieur ?","en":"Outside or inside?"},{"s":"you","cue":"Ask for the terrace if possible","fr":"En terrasse, si c'est possible.","alts":["En terrasse, s'il vous plaît","Dehors, si possible"]},{"s":"them","who":"Serveuse","fr":"Vous avez fait votre choix ?","en":"Have you decided?"},{"s":"you","cue":"Order the dish of the day","fr":"Oui, je vais prendre le plat du jour.","alts":["Le plat du jour, s'il vous plaît","Je vais prendre le plat du jour, s'il vous plaît"]},{"s":"them","who":"Serveuse","fr":"Et la cuisson pour la viande ?","en":"And how would you like the meat cooked?"},{"s":"you","cue":"Say medium","fr":"À point, s'il vous plaît.","alts":["À point"]},{"s":"them","who":"Serveuse","fr":"Et comme boisson ?","en":"And to drink?"},{"s":"you","cue":"Ask for a jug of tap water","fr":"Une carafe d'eau, s'il vous plaît.","alts":["Juste une carafe d'eau, merci"]},{"s":"them","who":"Serveuse","fr":"Tout s'est bien passé ?","en":"Was everything good?"},{"s":"you","cue":"Say yes, it was really good","fr":"Oui, c'était vraiment bon, merci !","alts":["Oui, c'était super bon","Oui, c'était délicieux, merci"]},{"s":"them","who":"Serveuse","fr":"Je vous apporte l'addition. Ensemble ou séparément ?","en":"I'll bring the bill. Together or separately?"},{"s":"you","cue":"Say separately","fr":"Séparément, s'il vous plaît.","alts":["On paye séparément, s'il vous plaît","Séparément"]}]},{"id":"airbnb","t":"Chez ton hôte","en":"Meeting your Airbnb host","setup":"Your host meets you at the apartment. He's your age, so it's tu.","lines":[{"s":"them","who":"Julien","fr":"Salut, c'est Julien ! T'as trouvé facilement ?","en":"Hi, I'm Julien! Did you find it OK?"},{"s":"you","cue":"Say hi, yes, no problem","fr":"Salut ! Oui, sans problème.","alts":["Salut, oui, c'était facile","Salut ! Oui, nickel"]},{"s":"them","who":"Julien","fr":"Super. Alors, voilà les clés. Celle-là, c'est pour la porte d'en bas.","en":"Great. So, here are the keys. That one's for the downstairs door."},{"s":"you","cue":"Ask what the wifi code is","fr":"C'est quoi, le code du wifi ?","alts":["Il est où, le code wifi ?","Tu peux me donner le code du wifi ?"]},{"s":"them","who":"Julien","fr":"Il est écrit sous la box, dans le salon.","en":"It's written under the router, in the living room."},{"s":"you","cue":"Ask where you put the trash","fr":"Et les poubelles, je les mets où ?","alts":["Je mets les poubelles où ?","Je jette les poubelles où ?"]},{"s":"them","who":"Julien","fr":"En bas, dans la cour. La jaune, c'est pour le recyclage.","en":"Downstairs in the courtyard. The yellow one is for recycling."},{"s":"you","cue":"Ask if you can leave your bags here on the last day","fr":"Le dernier jour, je peux laisser mes sacs ici ?","alts":["Je peux laisser mes valises le dernier jour ?","Le jour du départ, je peux laisser mes affaires ici ?"]},{"s":"them","who":"Julien","fr":"Ouais, pas de souci, jusqu'à midi.","en":"Yeah, no problem, until noon."},{"s":"you","cue":"Thank him, that's really nice of him","fr":"Merci, c'est super sympa !","alts":["Merci beaucoup !","Top, merci !"]}]},{"id":"metro","t":"Dans le métro","en":"Asking the way","setup":"You're in a metro station and the map makes no sense.","lines":[{"s":"you","cue":"Stop someone politely and ask which line goes to the Eiffel Tower","fr":"Excusez-moi, c'est quelle ligne pour aller à la tour Eiffel ?","alts":["Pardon, pour la tour Eiffel, c'est quelle ligne ?","Excusez-moi, je prends quelle ligne pour la tour Eiffel ?"]},{"s":"them","who":"Passante","fr":"Alors, vous prenez la six, direction Charles de Gaulle, et vous descendez à Bir-Hakeim.","en":"So, you take line six towards Charles de Gaulle, and you get off at Bir-Hakeim."},{"s":"you","cue":"Ask her to repeat the name of the station","fr":"Pardon, vous pouvez répéter le nom de la station ?","alts":["Vous pouvez répéter plus lentement, s'il vous plaît ?","Désolé, c'est quelle station ?"]},{"s":"them","who":"Passante","fr":"Bir-Hakeim. B, I, R. C'est écrit sur le plan.","en":"Bir-Hakeim. B, I, R. It's on the map."},{"s":"you","cue":"Ask if you have to change lines","fr":"Il faut changer ?","alts":["Je dois changer de ligne ?","Y a un changement ?"]},{"s":"them","who":"Passante","fr":"Non, c'est direct d'ici.","en":"No, it's direct from here."},{"s":"you","cue":"Thank her","fr":"Super, merci beaucoup !","alts":["Merci, bonne journée !","Merci, c'est gentil !"]}]},{"id":"train","t":"Train annulé","en":"Your train is cancelled","setup":"At the SNCF desk in the station. The board says « supprimé ».","lines":[{"s":"them","who":"Agent","fr":"Bonjour, je peux vous aider ?","en":"Hello, can I help you?"},{"s":"you","cue":"Say your train to Lyon is cancelled","fr":"Bonjour, mon train pour Lyon est annulé.","alts":["Bonjour, mon train pour Lyon a été annulé","Bonjour, mon TGV pour Lyon est supprimé"]},{"s":"them","who":"Agent","fr":"Ah oui, désolé, c'est à cause de la grève. Vous avez votre billet ?","en":"Ah yes, sorry, it's because of the strike. Do you have your ticket?"},{"s":"you","cue":"Say yes, it's on your phone","fr":"Oui, il est sur mon téléphone.","alts":["Oui, sur mon portable","Oui, le voilà, sur mon téléphone"]},{"s":"them","who":"Agent","fr":"Je peux vous mettre sur le train de seize heures douze.","en":"I can put you on the 4:12 pm train."},{"s":"you","cue":"Ask if it's direct","fr":"Il est direct ?","alts":["C'est un train direct ?","Y a une correspondance ?"]},{"s":"them","who":"Agent","fr":"Oui, direct. Arrivée à dix-huit heures dix.","en":"Yes, direct. Arriving at 6:10 pm."},{"s":"you","cue":"Ask if you have to pay extra","fr":"Je dois payer un supplément ?","alts":["Il faut payer quelque chose en plus ?","Ça coûte plus cher ?"]},{"s":"them","who":"Agent","fr":"Non, c'est sans frais. Voilà votre nouveau billet.","en":"No, there's no charge. Here's your new ticket."},{"s":"you","cue":"Say perfect, thank you very much","fr":"Parfait, merci beaucoup.","alts":["Super, merci","Merci, bonne journée"]}]},{"id":"pharmacie","t":"À la pharmacie","en":"At the pharmacy","setup":"You woke up with a bad headache.","lines":[{"s":"them","who":"Pharmacienne","fr":"Bonjour, qu'est-ce qu'il vous faut ?","en":"Hello, what do you need?"},{"s":"you","cue":"Say you have a really bad headache","fr":"Bonjour, j'ai très mal à la tête.","alts":["J'ai un gros mal de tête","Bonjour, j'ai mal à la tête"]},{"s":"them","who":"Pharmacienne","fr":"Depuis quand ?","en":"Since when?"},{"s":"you","cue":"Say since last night","fr":"Depuis hier soir.","alts":["Depuis hier soir, à peu près"]},{"s":"them","who":"Pharmacienne","fr":"Vous avez de la fièvre ?","en":"Do you have a fever?"},{"s":"you","cue":"Say no, you don't think so","fr":"Non, je crois pas.","alts":["Non, je pense pas","Non, pas de fièvre"]},{"s":"them","who":"Pharmacienne","fr":"Vous êtes allergique à quelque chose ?","en":"Are you allergic to anything?"},{"s":"you","cue":"Say no, nothing","fr":"Non, à rien.","alts":["Non, je suis allergique à rien","Non, aucune allergie"]},{"s":"them","who":"Pharmacienne","fr":"Alors je vous donne du Doliprane. Un comprimé, trois fois par jour maximum.","en":"Then I'll give you Doliprane. One tablet, three times a day at most."},{"s":"you","cue":"Ask if you take it with meals","fr":"Je le prends pendant les repas ?","alts":["Je dois le prendre en mangeant ?","Avec ou sans manger ?"]},{"s":"them","who":"Pharmacienne","fr":"Comme vous voulez, avec un grand verre d'eau.","en":"As you like, with a big glass of water."},{"s":"you","cue":"Thank her and say goodbye","fr":"Merci beaucoup, au revoir.","alts":["Merci, bonne journée","Merci, au revoir"]}]},{"id":"sim","t":"Une carte SIM","en":"Getting a SIM card","setup":"In a phone shop, your first day in France.","lines":[{"s":"them","who":"Vendeur","fr":"Bonjour, je peux vous renseigner ?","en":"Hello, can I help you?"},{"s":"you","cue":"Say you'd like a prepaid SIM card","fr":"Oui, je voudrais une carte SIM prépayée.","alts":["Bonjour, je cherche une carte SIM prépayée","Je voudrais une SIM prépayée, s'il vous plaît"]},{"s":"them","who":"Vendeur","fr":"Vous restez combien de temps en France ?","en":"How long are you staying in France?"},{"s":"you","cue":"Say about three months","fr":"Trois mois, à peu près.","alts":["Environ trois mois","Je reste trois mois"]},{"s":"them","who":"Vendeur","fr":"Alors je vous conseille ce forfait : cent gigas pour vingt euros par mois.","en":"Then I'd recommend this plan: a hundred gigs for twenty euros a month."},{"s":"you","cue":"Ask if it works for calling the US","fr":"Ça marche pour appeler les États-Unis ?","alts":["Je peux appeler aux États-Unis avec ?","Les appels vers les États-Unis sont inclus ?"]},{"s":"them","who":"Vendeur","fr":"Les appels, non, mais WhatsApp, oui, sans problème. Vous avez une pièce d'identité ?","en":"Calls, no, but WhatsApp, yes, no problem. Do you have ID?"},{"s":"you","cue":"Say yes, you have your passport","fr":"Oui, j'ai mon passeport.","alts":["Oui, voilà mon passeport","Mon passeport, ça va ?"]},{"s":"them","who":"Vendeur","fr":"Parfait. Votre téléphone est bien débloqué ?","en":"Perfect. Your phone is unlocked, right?"},{"s":"you","cue":"Say you think so, but you're not sure","fr":"Je crois, mais je suis pas sûr.","alts":["Normalement oui, mais je suis pas sûr","Je pense, mais j'en suis pas sûr"]},{"s":"them","who":"Vendeur","fr":"Pas de souci, on va tester.","en":"No problem, we'll test it."}]},{"id":"stage","t":"Premier jour de stage","en":"First day at your internship","setup":"Your manager comes to meet you at reception.","lines":[{"s":"them","who":"Claire","fr":"Bonjour, vous devez être Zack ? Moi, c'est Claire.","en":"Hello, you must be Zack? I'm Claire."},{"s":"you","cue":"Say yes, that's you, nice to meet her","fr":"Oui, c'est moi. Enchanté !","alts":["Oui, bonjour, enchanté","Oui, c'est ça, enchanté !"]},{"s":"them","who":"Claire","fr":"Bienvenue ! Le trajet s'est bien passé ?","en":"Welcome! Did the trip in go OK?"},{"s":"you","cue":"Say yes, very well, you took the metro","fr":"Oui, très bien, j'ai pris le métro.","alts":["Oui, ça s'est bien passé, je suis venu en métro","Oui, nickel, j'ai pris le métro"]},{"s":"them","who":"Claire","fr":"Super. Bon, ici tout le monde se tutoie, ça te va ?","en":"Great. So, everyone uses tu here, is that OK with you?"},{"s":"you","cue":"Say yes, of course, no problem","fr":"Oui, bien sûr, pas de problème !","alts":["Oui, carrément !","Oui, avec plaisir"]},{"s":"them","who":"Claire","fr":"Je te montre ton bureau. T'as des questions pour l'instant ?","en":"I'll show you your desk. Any questions for now?"},{"s":"you","cue":"Ask what time everyone usually eats lunch","fr":"Vous mangez à quelle heure, en général ?","alts":["On mange à quelle heure, le midi ?","Vous déjeunez vers quelle heure ?"]},{"s":"them","who":"Claire","fr":"Vers midi et demi. On va souvent à la cantine ensemble.","en":"Around twelve thirty. We often go to the canteen together."},{"s":"you","cue":"Say great, and ask where the coffee machine is","fr":"Super. Et la machine à café, elle est où ?","alts":["Cool, et elle est où, la machine à café ?","Top. Elle est où, la machine à café ?"]},{"s":"them","who":"Claire","fr":"Au bout du couloir, à gauche. C'est le plus important !","en":"End of the hall, on the left. That's the most important thing!"}]},{"id":"afterwork","t":"Un verre après le boulot","en":"Drinks after work","setup":"Friday evening at a bar with Léa, a coworker your age.","lines":[{"s":"them","who":"Léa","fr":"Alors, tu bois quoi ?","en":"So, what are you drinking?"},{"s":"you","cue":"Say a pint","fr":"Une pinte, merci !","alts":["Je vais prendre une pinte","Une bière, une pinte"]},{"s":"them","who":"Léa","fr":"Ça marche. Et alors, t'es là pour combien de temps ?","en":"Sure. So how long are you here for?"},{"s":"you","cue":"Say until the end of August","fr":"Jusqu'à fin août.","alts":["Jusqu'à la fin du mois d'août","Jusqu'à fin août, à peu près"]},{"s":"them","who":"Léa","fr":"Et tu kiffes Paris pour l'instant ?","en":"And are you liking Paris so far?"},{"s":"you","cue":"Say yeah, a lot, but it's expensive","fr":"Ouais, grave, mais c'est cher !","alts":["Oui, j'adore, mais c'est cher","Ouais, trop, mais c'est hyper cher"]},{"s":"them","who":"Léa","fr":"Grave. Tu fais quoi ce week-end ?","en":"Totally. What are you doing this weekend?"},{"s":"you","cue":"Say you don't know yet, maybe watch the PSG match","fr":"Je sais pas encore, peut-être regarder le match du PSG.","alts":["Chais pas encore, peut-être le match du PSG","Je sais pas trop, peut-être regarder le PSG"]},{"s":"them","who":"Léa","fr":"Ah, t'es fan du PSG ? On peut le regarder dans un bar, si tu veux.","en":"Oh, you're a PSG fan? We can watch it at a bar if you want."},{"s":"you","cue":"Say yeah, totally, you're up for it","fr":"Ouais, carrément, je suis chaud !","alts":["Ouais, avec plaisir !","Grave, je suis partant !"]},{"s":"them","who":"Léa","fr":"Trop bien, je te dis où samedi.","en":"Awesome, I'll tell you where on Saturday."}]},{"id":"soiree","t":"En soirée","en":"At a party","setup":"A friend of a friend comes over to say hi.","lines":[{"s":"them","who":"Hugo","fr":"Salut ! Moi, c'est Hugo. Tu connais qui, ici ?","en":"Hi! I'm Hugo. Who do you know here?"},{"s":"you","cue":"Say hi, you're Zack, you know Léa from work","fr":"Salut, moi c'est Zack. Je connais Léa, on bosse ensemble.","alts":["Salut, Zack. Je suis un collègue de Léa","Salut ! Zack. Je travaille avec Léa"]},{"s":"them","who":"Hugo","fr":"Ah, cool ! T'as un petit accent, tu viens d'où ?","en":"Oh, cool! You've got a bit of an accent, where are you from?"},{"s":"you","cue":"Say you're American, from Georgia. The state, not the country!","fr":"Je suis américain, de Géorgie. L'État, pas le pays !","alts":["Je viens des États-Unis, de Géorgie, l'État","Je suis américain, je viens de Géorgie, aux États-Unis"]},{"s":"them","who":"Hugo","fr":"Haha, ok ! Et tu fais quoi à Paris ?","en":"Haha, OK! And what are you doing in Paris?"},{"s":"you","cue":"Say you're doing an internship this summer, you study engineering","fr":"Je fais un stage cet été. Je suis étudiant en ingénierie.","alts":["Je suis en stage pour l'été, je fais des études d'ingénieur","Je fais un stage, je suis étudiant ingénieur"]},{"s":"them","who":"Hugo","fr":"Trop bien. Et ton français est super bon, tu l'as appris où ?","en":"Awesome. And your French is really good, where did you learn it?"},{"s":"you","cue":"Say thanks, at school and with an app, but you still have a lot to learn","fr":"Merci ! À l'école et avec une appli, mais j'ai encore beaucoup à apprendre.","alts":["Merci, c'est gentil ! À l'école, et avec une appli","Merci ! J'ai appris à l'école, mais j'ai encore du boulot"]},{"s":"them","who":"Hugo","fr":"Mais non, franchement, ça va ! Tu veux un truc à boire ?","en":"No, honestly, it's good! Want something to drink?"},{"s":"you","cue":"Say yeah, sure, what is there?","fr":"Ouais, je veux bien. Y a quoi ?","alts":["Ouais, y a quoi ?","Je veux bien, qu'est-ce qu'il y a ?"]}]},{"id":"match","t":"Le match au bar","en":"Watching PSG at a bar","setup":"It's match night and the bar is packed.","lines":[{"s":"you","cue":"Ask the barman if there's still room to watch the match","fr":"Bonsoir, il reste de la place pour le match ?","alts":["Bonsoir, y a de la place pour regarder le match ?","Excusez-moi, il y a encore de la place ?"]},{"s":"them","who":"Barman","fr":"Au fond, là-bas, y a une table. Vous voulez boire quoi ?","en":"In the back, over there, there's a table. What would you like to drink?"},{"s":"you","cue":"Order two pints of lager","fr":"Deux pintes de blonde, s'il vous plaît.","alts":["Deux pintes, s'il vous plaît","Deux blondes, s'il vous plaît"]},{"s":"them","who":"Supporter","fr":"Y a combien ? Je viens d'arriver.","en":"What's the score? I just got here."},{"s":"you","cue":"Say one-nil to Paris, Dembélé scored","fr":"Un-zéro pour Paris, c'est Dembélé qui a marqué.","alts":["Un à zéro pour Paris","Paris mène un-zéro, but de Dembélé"]},{"s":"them","who":"Supporter","fr":"Ah, trop bien ! Ils jouent bien ce soir ?","en":"Oh, great! Are they playing well tonight?"},{"s":"you","cue":"Say yeah, but the defense is a bit weak","fr":"Ouais, mais la défense est un peu faible.","alts":["Oui, mais derrière c'est un peu fragile","Ouais, mais la défense, c'est pas ouf"]},{"s":"them","who":"Supporter","fr":"Ouais, comme d'hab. Allez Paris !","en":"Yeah, as usual. Come on Paris!"},{"s":"you","cue":"Cheer with him","fr":"Allez Paris !","alts":["Ici c'est Paris !"]}]},{"id":"comprendspas","t":"Je comprends pas","en":"When you don't understand","setup":"Someone stops you in the street and talks fast.","lines":[{"s":"them","who":"Passant","fr":"Excusez-moi, vous savez s'il y a une boulangerie ouverte dans le coin, le dimanche ?","en":"Excuse me, do you know if there's a bakery open around here on Sundays?"},{"s":"you","cue":"Say sorry, and ask him to repeat more slowly","fr":"Pardon, vous pouvez répéter plus lentement, s'il vous plaît ?","alts":["Désolé, vous pouvez parler plus lentement ?","Pardon, j'ai pas compris, vous pouvez répéter ?"]},{"s":"them","who":"Passant","fr":"Une boulangerie. Ouverte. Aujourd'hui. Vous savez où ?","en":"A bakery. Open. Today. Do you know where?"},{"s":"you","cue":"Say sorry, you're not from around here","fr":"Désolé, je suis pas d'ici.","alts":["Désolé, je connais pas le quartier","Ah, désolé, je suis touriste"]},{"s":"them","who":"Passant","fr":"Ah, pas de souci, merci quand même !","en":"Ah, no worries, thanks anyway!"},{"s":"you","cue":"Wish him a good day","fr":"Bonne journée !","alts":["Bonne journée, désolé !","Bon courage !"]}]}],"ear":[{"id":"u","t":"« u » or « ou »","tip":"« ou » is the “oo” in food. « u » has no English twin: say “ee”, then round your lips tight like a whistle without moving your tongue. Mix them up and tu (you) becomes tout (all).","pairs":[["tu","you","tout","all"],["vu","seen","vous","you (formal)"],["la rue","the street","la roue","the wheel"],["dessus","on top","dessous","underneath"],["pur","pure","pour","for"],["Il est sûr.","He's sure.","Il est sourd.","He's deaf."],["russe","Russian","rousse","red-haired"]]},{"id":"nasal","t":"The three nasal sounds","tip":"French has three nasal vowels and each makes different words. « in / ain » is like the a in “van” pushed through the nose. « an / en » is an open “ah” through the nose. « on » is a closed “oh” through the nose, lips rounded.","pairs":[["le vin","the wine","le vent","the wind"],["le vent","the wind","ils vont","they go"],["le pain","the bread","le pont","the bridge"],["C'est lent.","It's slow.","C'est long.","It's long."],["blanc","white","blond","blond"],["un banc","a bench","un bain","a bath"],["le temps","time, weather","le thon","the tuna"]]},{"id":"article","t":"One or several","tip":"Spoken French often shows plural only in the little word in front. « le » sounds like “luh”, « les » like “lay”. « ce / ces » and « deux / des » work the same way.","pairs":[["le café","the coffee","les cafés","the coffees"],["ce verre","this glass","ces verres","these glasses"],["Je le prends.","I'll take it.","Je les prends.","I'll take them."],["le gâteau","the cake","les gâteaux","the cakes"],["du pain","some bread","deux pains","two loaves"],["deux amis","two friends","des amis","some friends"]]},{"id":"past","t":"Now or already done","tip":"The past often differs by one small sound: « je » (“zhuh”) vs « j'ai » (“zhay”). It's the difference between doing it and having done it.","pairs":[["Je fais.","I'm doing it.","J'ai fait.","I did it."],["Je mange.","I'm eating.","J'ai mangé function progress() {

/* feedback after an answer */
function answer(st, ok, info = {}) {
  const s = session;
  if (!st.retry && !st.answered) {
    st.answered = true;
    if (ok) s.ok++; else s.bad++;
    if (st.f && (s.kind === 'review' || s.kind === 'practice') && !s.graded[st.f]) { s.graded[st.f] = 1; grade(st.f, ok); }
    if (!ok && st.f && ['lesson', 'review', 'practice'].includes(s.kind) && !s.missed.includes(st.f)) { s.missed.push(st.f); s.steps.push(retryStep(st)); }
    if (s.kind === 'place') { placeAfter(s, st, ok); persistResume(); }
  }
  logActivity(s.kind === 'review' || s.kind === 'practice' ? 'review' : 'answer');
  sfx(ok ? 'ok' : 'bad'); vib(ok ? 10 : [20, 40, 20]);
  const it = st.f ? ITEMS[st.f] : null;
  const ansFr = info.fr || (it ? it.f : ''), ansEn = info.en != null ? info.en : (it ? it.e : '');
  SV.foot.className = 'sfoot ' + (ok ? 'fb-ok' : 'fb-bad');
  const fb = h('div', {class: 'fb'}, h('div', {class: 'ic'}, ok ? '✓' : '!'),
    h('div', {class: 'grow'}, h('h4', null, ok ? pick(['Correct!', 'Nice!', 'Exactly!', 'Parfait !', 'Bien joué !']) : 'Not quite'),
      !ok || info.show ? h('div', null, h('div', {class: 'ans'}, ansFr), ansEn ? h('div', {class: 'ansen'}, ansEn) : null) : null,
      info.note ? h('div', {class: 'note'}, info.note) : null),
    ansFr && self.AUDIO[info.audio || ansFr] ? spk(info.audio || ansFr) : null);
  if (s.kind === 'place' && ok && !info.note) {   // placement keeps moving: a right answer doesn't need a tap
    footer(h('div', {class: 'fbwrap'}, fb)); const at = s.i;
    setTimeout(() => { if (session === s && s.i === at) next(); }, 800); return;
  }
  footer(h('div', {class: 'fbwrap'}, fb, continueBtn('Continue', ok ? 'green' : 'amber')));
  if (S.set.auto && (info.audio || ansFr) && info.play !== false) play(info.audio || ansFr);

  const prevBtn = h('button', {class: 'c', 'aria-label': 'Previous phrase', html: I.prev}), nextBtn = h('button', {class: 'c', 'aria-label': 'Next phrase', html: I.next});
  const note = h('div', {class: 'muted small', style: 'text-align:center;margin-top:6px'});
  inner.append(h('div', {class: 'kick'}, 'Hands-free'), card, bar, h('div', {class: 'shctl', style: 'margin-top:18px'}, prevBtn, playBtn, nextBtn), note);
  footer(h('button', {class: 'btn ghost', onclick: () => end()}, 'Finish'));
  let segs = [], cur = -1, au = null, url = null, fallback = false, running = false, token = 0;
  const show = (i, ph2) => {
    const sg = segs[i]; if (!sg) return;
    const it = ITEMS[sg.f];
    if (i !== cur) { cur = i; cnt.textContent = (i + 1) + ' / ' + segs.length; }
    const q = sg.rec ? it.f : it.e, a = sg.rec ? it.e : it.f;
    top.textContent = q; top.className = 'hftop' + (sg.rec ? ' fr' : '');
    bottom.textContent = ph2 === 'ans' ? a : ''; bottom.className = 'hfbot' + (sg.rec ? ' en' : '');
    ph.textContent = ph2 === 'ans' && !sg.rec && S.set.phon && it.p ? it.p : '';
    phase.textContent = ph2 === 'listen' ? (sg.rec ? 'What does it mean?' : 'Listen') : ph2 === 'think' ? (sg.rec ? 'Think of the meaning…' : 'Your turn: say it in French') : 'Again, out loud';
    phase.className = 'hfphase' + (ph2 === 'think' ? ' go' : '');
  };
  const paintBtn = () => { playBtn.innerHTML = running ? I.pause : I.play; playBtn.setAttribute('aria-label', running ? 'Pause' : 'Play'); };
  const ms = navigator.mediaSession;
  const setMeta = () => { if (!ms) return; try { ms.metadata = new MediaMetadata({title: 'Hands-free · ' + list.length + ' phrases', artist: 'Français', artwork: [{src: 'icon-512.png', sizes: '512x512', type: 'image/png'}]}); } catch (e) {} };
  const jump = d => {
    if (!segs.length) return;
    let i = Math.max(0, cur);
    if (fallback) { i = Math.max(0, Math.min(segs.length - 1, i + d)); token++; cur = -1; runFallback(i); return; }
    const t = au.currentTime;
    if (d < 0 && t - segs[i].start > 2) d = 0;   // first press restarts the phrase
    i = Math.max(0, Math.min(segs.length - 1, i + d));
    au.currentTime = segs[i].start + .01;
  };
  prevBtn.onclick = () => jump(-1); nextBtn.onclick = () => jump(1);
  playBtn.onclick = () => {
    if (fallback) { if (running) { token++; running = false; stopAudio(); paintBtn(); } else runFallback(Math.max(0, cur)); return; }
    if (au.paused) au.play().catch(() => {}); else au.pause();
  };
  async function runFallback(from) {   // decoding failed: play clip by clip (needs the screen on)
    const my = ++token; running = true; paintBtn();
    try { if (navigator.wakeLock) s.lock = await navigator.wakeLock.request('screen'); } catch (e) {}
    for (let i = from; i < segs.length; i++) {
      const sg = segs[i], it = ITEMS[sg.f], q = sg.rec ? sg.f : 'en|' + it.e, a = sg.rec ? 'en|' + it.e : sg.f;
      show(i, 'listen'); fill.style.width = (i / segs.length * 100) + '%';
      await play(q); if (my !== token) return;
      show(i, 'think'); await wait(sg.rec ? 2200 : 3500); if (my !== token) return;
      show(i, 'ans'); await play(a); await wait(900); if (my !== token) return;
      await play(sg.rec ? sg.f : a); await wait(1500); if (my !== token) return;
    }
    running = false; paintBtn(); end(true);
  }
  s.cleanup = () => { token++; if (au) { au.pause(); au.removeAttribute('src'); } if (url) URL.revokeObjectURL(url); if (s.lock) s.lock.release().catch(() => {}); if (ms) { try { ms.metadata = null; } catch (e) {} } };
  function end(finished) {
    s.cleanup();
    inner.innerHTML = '';
    const marked = new Set();
    inner.append(h('div', {class: 'kick'}, 'Hands-free'), h('div', {class: 'qtitle', style: 'margin-bottom:4px'}, finished ? 'Done!' : 'Stopped'),
      h('div', {class: 'muted', style: 'margin-bottom:14px'}, 'Any you couldn\'t say? Tap them and they\'ll come back in your reviews tomorrow.'));
    const box = h('div', {class: 'ilist'});
    list.slice(0, cur < 0 ? list.length : Math.max(cur + 1, 1)).forEach(f => {
      const it = ITEMS[f];
      const r = h('button', {class: 'hfrow'}, h('div', {class: 'grow'}, h('b', null, it.f), h('span', null, it.e)), h('span', {class: 'hfmark'}, 'Missed'));
      r.onclick = () => { if (marked.has(f)) marked.delete(f); else marked.add(f); r.classList.toggle('on', marked.has(f)); };
      box.append(r);
    });
    inner.append(box);
    footer(h('button', {class: 'btn primary', onclick: () => {
      marked.forEach(f => grade(f, false));
      s.bad = marked.size; s.ok = box.children.length - marked.size; s.heard = box.children.length; s.missed = [...marked];
      logActivity('review', box.children.length); next();
    }}, 'Done'));
  }
  (async () => {
    try {
      const tr = await hfTrack(list);
      if (session !== s || !inner.isConnected) { URL.revokeObjectURL(tr.url); return; }
      segs = tr.segs; url = tr.url;
      au = new Audio(); au.preload = 'auto'; au.src = url;
      au.ontimeupdate = () => {
        if (!inner.isConnected) { au.pause(); return; }
        const t = au.currentTime; fill.style.width = (t / tr.dur * 100) + '%';
        let i = segs.findIndex(sg => t < sg.end); if (i < 0) i = segs.length - 1;
        const sg = segs[i]; show(i, t < sg.think ? 'listen' : t < sg.ans ? 'think' : 'ans');
      };
      au.onplay = () => { running = true; paintBtn(); }; au.onpause = () => { running = false; paintBtn(); };
      au.onended = () => end(true);
      setMeta();
      if (ms) { const hd = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
        hd('play', () => au.play()); hd('pause', () => au.pause()); hd('previoustrack', () => jump(-1)); hd('nexttrack', () => jump(1)); }
      show(0, 'listen'); phase.textContent = 'Ready · ' + Math.round(tr.dur / 60) + ' min'; playBtn.disabled = false;
      note.textContent = 'Tap play, then lock your phone if you like. It keeps going.';
    } catch (e) {
      fallback = true; segs = list.map(f => ({f, rec: !!ITEMS[f].rec}));
      show(0, 'listen'); phase.textContent = 'Ready'; playBtn.disabled = false;
      note.textContent = 'Keep the screen on for this one.';
    }
  })();
};

/* ---------------- finishing a session ---------------- */
function finish() {
  const s = session; s.finished = true;
  SV.bar.style.width = '100%'; SV.cnt.textContent = '';
  const total = s.ok + s.bad, acc = total ? Math.round(s.ok / total * 100) : 100;
  const mins = Math.max(1, Math.round((Date.now() - s.t0) / 60000));
  const inner = h('div', {class: 'in'});
  SV.body.innerHTML = ''; SV.body.append(inner);
  if (s.kind === 'place') return placeResults(s, inner);
  let title = 'Session complete', sub = '', cando = null, primary = null;
  if (s.kind === 'lesson') {
    const l = LESSONS[s.id];
    S.done[l.id] = {t: Date.now(), s: acc};
    l.items.forEach(f => introduce(f, 1));
    if (S.resume && S.resume.id === l.id) S.resume = null;
    logActivity('lesson'); save();
    title = 'Leçon terminée !'; sub = l.t;
    if (l.goal) cando = h('div', {class: 'cando'}, h('b', null, 'You can now: '), l.goal.charAt(0).toLowerCase() + l.goal.slice(1) + '.', h('br'), h('span', {class: 'small'}, l.items.length + ' phrases added to your reviews. First one comes back tomorrow.'));
    const nl = nextLesson(l.course);
    if (nl) primary = h('button', {class: 'btn primary', onclick: () => startLesson(nl.id)}, 'Next: ' + nl.t);
    if (l.dlg) s.extra = h('button', {class: 'btn ghost', onclick: () => startShadow(l.id)}, 'Shadow the conversation (2 min)');
    confetti();
  } else if (s.kind === 'test') {
    const u = UNITS[s.id], passed = s.ok >= Math.ceil(s.steps.length * 0.8);
    if (passed) { u.lessons.forEach(l => { if (!S.done[l.id]) S.done[l.id] = {t: Date.now(), s: acc, test: 1}; l.items.forEach(f => introduce(f, 2)); }); confetti(); }
    save();
    title = passed ? 'Unit passed!' : 'Not yet'; sub = passed ? 'All of “' + u.t + '” is marked done.' : s.ok + ' of ' + s.steps.length + '. You need ' + Math.ceil(s.steps.length * .8) + '. Do the lessons and you\'ll fly through it.';
    if (!passed) primary = h('button', {class: 'btn primary', onclick: () => startLesson(u.lessons.find(l => !lessonDone(l.id)).id)}, 'Start the first lesson');
  } else if (s.kind === 'shadow') {
    title = 'Nice shadowing!'; sub = LESSONS[s.id].t + '. Do it again tomorrow; repetition is the whole trick.';
    primary = h('button', {class: 'btn primary', onclick: () => startShadow(s.id)}, 'Shadow it again');
    logActivity('review'); save();
  } else if (s.kind === 'role') {
    const sc = roleScene(s.id), n = s.ok + s.bad, prev = S.roles[s.id];
    S.roles[s.id] = {best: Math.max(prev ? prev.best : 0, s.ok), n, t: Date.now()};
    logActivity('review', n); save();
    title = s.bad ? 'Scene done' : 'Parfait !'; sub = sc.t + ' · you said ' + s.ok + ' of ' + n + ' on your own';
    if (s.missed.length) cando = h('div', {class: 'cando'}, h('b', null, 'Say these a few more times:'), ...s.missed.map(fr => exRow(fr)));
    primary = h('button', {class: 'btn primary', onclick: () => startRole(s.id)}, 'Play it again');
    s.extra = h('button', {class: 'btn ghost', onclick: () => { exitSession(true); rolePicker(); }}, 'Another scene');
  } else if (s.kind === 'ear') {
    const weak = DATA.ear.map(g => [g, earAcc(g.id)]).filter(x => x[1] != null && x[1] < .85).sort((a, b) => a[1] - b[1])[0];
    title = 'Ear training done'; sub = weak ? 'Hardest for you right now: ' + weak[0].t + ' (' + Math.round(weak[1] * 100) + '%). Mixed practice will keep bringing it back.' : 'Your ear is getting sharp. Come back tomorrow; little and often works best.';
    primary = h('button', {class: 'btn primary', onclick: () => startEar(s.id)}, 'Again');
    logActivity('review', 0); save();
  } else if (s.kind === 'hands') {
    title = 'Hands-free done'; sub = s.heard + ' phrases' + (s.bad ? ', ' + s.bad + ' back in tomorrow\'s reviews' : '') + '.';
    primary = h('button', {class: 'btn primary', onclick: () => startHands(s.list)}, 'Play it again');
  } else if (s.kind === 'verb') {
    title = 'Verb practice done'; sub = DATA.verbs[s.id].inf;
    primary = h('button', {class: 'btn primary', onclick: () => startVerbDrill(s.id)}, 'Again');
  } else {
    title = s.kind === 'review' ? 'Reviews done!' : 'Practice done!';
    const left = dueList().length;
    sub = left ? left + ' more due. Keep going or come back later.' : 'You\'re all caught up.';
    if (left) primary = h('button', {class: 'btn primary', onclick: () => startReview(dueList(), s.mode, 'review')}, 'Review ' + Math.min(left, S.set.size) + ' more');
  }
  sfx('done');
  inner.append(h('div', {class: 'donebox'},
    h('div', {class: 'tick', html: I.check}), h('h2', null, title), h('div', {class: 'dsub'}, sub),
    s.kind === 'shadow' || s.kind === 'hands' ? null : h('div', {class: 'dstats'},
      h('div', {class: 'stat'}, h('b', null, acc + '%'), h('span', null, 'accuracy')),
      h('div', {class: 'stat'}, h('b', null, total), h('span', null, 'answers')),
      h('div', {class: 'stat'}, h('b', null, mins), h('span', null, mins === 1 ? 'minute' : 'minutes'))),
    cando));
  footer(h('div', {style: 'display:grid;gap:10px'}, primary, s.extra || null, h('button', {class: 'btn ' + (primary ? 'ghost' : 'primary'), onclick: () => exitSession(true)}, 'Done')));
}
function confetti() {
  const c = h('div', {class: 'confetti'});
  const cols = ['#5ecb92', '#c3cbd6', '#8fb0ff', '#e6ebf2', '#a8e6c6'];
  for (let i = 0; i < 40; i++) c.append(h('i', {style: `left:${Math.random() * 100}%;background:${cols[i % cols.length]};animation-delay:${Math.random() * .4}s;animation-duration:${1.4 + Math.random()}s`}));
  document.body.append(c); setTimeout(() => c.remove(), 2600);
}

/* ---------------- boot ---------------- */
function fitViewport() { const vv = window.visualViewport; document.documentElement.style.setProperty('--vvh', (vv ? vv.height : innerHeight) + 'px'); }
if (window.visualViewport) { visualViewport.addEventListener('resize', fitViewport); visualViewport.addEventListener('scroll', fitViewport); }
fitViewport();
document.addEventListener('keydown', e => {
  if (!session || e.target.tagName === 'INPUT') return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) { const o = SV.body.querySelectorAll('.opt')[n - 1]; if (o) o.click(); }
  if (e.key === 'Enter') { const b = SV.foot.querySelector('.btn:not([disabled])'); if (b) b.click(); }
});
render();
updateBadge();
if (!S.onboard) setTimeout(onboarding, 300);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // A new version installs in the background; swap to it as soon as it's safe (never mid-lesson).
  const hadSW = !!navigator.serviceWorker.controller;
  let reloadPending = false;
  const swap = () => { if (session && !session.finished) { reloadPending = true; return; } saveNow(); location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW) swap(); });
  setInterval(() => { if (reloadPending && (!session || session.finished)) { reloadPending = false; swap(); } }, 2000);
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
