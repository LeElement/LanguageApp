<script>const DATA={"courses":[{"id":"voyage","t":"Le français parlé","sub":"Everyday spoken French for your trip","units":[{"id":"u1","t":"Bonjour !","en":"Greetings & politeness","lessons":[{"id":"u1l1","t":"Dire bonjour","goal":"Greet anyone, any time of day","items":["Bonjour","Bonsoir","Salut","Au revoir","Bonne journée","Bonne soirée","À bientôt"],"tip":{"h":"Always start with « bonjour »","p":"In France you say bonjour before anything else: to the shopkeeper, the bus driver, the waiter. Asking a question without it comes across as rude. After about 6 pm, switch to bonsoir.","x":"Bonjour, un café s'il vous plaît.","xe":"Hello, a coffee please."},"dlg":[{"s":"Boulangère","fr":"Bonjour monsieur !","en":"Hello, sir!"},{"s":"Toi","fr":"Bonjour madame !","en":"Hello, ma'am!"},{"s":"Boulangère","fr":"Voilà, bonne journée !","en":"Here you go, have a good day!"},{"s":"Toi","fr":"Merci, bonne journée !","en":"Thanks, have a good day!"}]},{"id":"u1l2","t":"Les mots magiques","goal":"Say please, thank you and sorry","items":["S'il vous plaît","S'il te plaît","Merci","Merci beaucoup","De rien","Pardon","Excusez-moi","Désolé"],"tip":{"h":"Pardon vs excusez-moi vs désolé","p":"Pardon: you bumped into someone or need to get past. Excusez-moi: you want someone's attention. Désolé: you're actually apologizing.","x":"Excusez-moi madame, vous avez l'heure ?","xe":"Excuse me ma'am, do you have the time?"},"dlg":[{"s":"Toi","fr":"Pardon !","en":"Sorry!"},{"s":"Passante","fr":"Pas de souci.","en":"No worries."},{"s":"Toi","fr":"Excusez-moi, où est le métro ?","en":"Excuse me, where's the metro?"},{"s":"Passante","fr":"Juste là, à droite.","en":"Right there, on the right."},{"s":"Toi","fr":"Merci beaucoup !","en":"Thank you very much!"},{"s":"Passante","fr":"De rien !","en":"You're welcome!"}]},{"id":"u1l3","t":"Oui, non, ça va","goal":"Answer simple questions","items":["Oui","Non","D'accord","Ça va ?","Ça va bien, merci","Et toi ?","Pas mal","Super"],"dlg":[{"s":"Léa","fr":"Salut ! Ça va ?","en":"Hi! How's it going?"},{"s":"Toi","fr":"Ça va bien, merci. Et toi ?","en":"I'm fine, thanks. And you?"},{"s":"Léa","fr":"Pas mal ! Un café ?","en":"Not bad! A coffee?"},{"s":"Toi","fr":"Oui, d'accord !","en":"Yes, okay!"}]},{"id":"u1l4","t":"Tu ou vous ?","goal":"Know when to be formal","items":["Madame","Monsieur","Vous allez bien ?","Je vais bien, merci","Et vous ?","Tu vas bien ?","Enchanté","On peut se tutoyer ?"],"tip":{"h":"Tu or vous?","p":"Use vous with strangers, staff, older people and anyone in a work setting. Use tu with friends, family, kids and people your age at a party. When in doubt, use vous and let the other person switch first.","x":"On peut se tutoyer ?","xe":"Can we use « tu »?"},"dlg":[{"s":"Mme Martin","fr":"Bonjour Zack, vous allez bien ?","en":"Hello Zack, how are you?"},{"s":"Toi","fr":"Je vais bien, merci. Et vous ?","en":"I'm well, thank you. And you?"},{"s":"Mme Martin","fr":"Très bien. On peut se tutoyer, tu sais.","en":"Very well. We can use « tu », you know."},{"s":"Toi","fr":"D'accord ! Tu vas bien ?","en":"Okay! Are you doing well?"}]}]},{"id":"u2","t":"Se présenter","en":"Talk about yourself","lessons":[{"id":"u2l1","t":"Je m'appelle…","goal":"Say your name and ask someone's","items":["Je m'appelle Zack","Moi, c'est Zack","Tu t'appelles comment ?","Vous vous appelez comment ?","Ravi de te rencontrer","Ça s'écrit comment ?"],"dlg":[{"s":"Hugo","fr":"Salut ! Moi, c'est Hugo.","en":"Hi! I'm Hugo."},{"s":"Toi","fr":"Salut Hugo, moi c'est Zack.","en":"Hi Hugo, I'm Zack."},{"s":"Hugo","fr":"Enchanté, Zack !","en":"Nice to meet you, Zack!"},{"s":"Toi","fr":"Ravi de te rencontrer !","en":"Glad to meet you!"}]},{"id":"u2l2","t":"D'où tu viens ?","goal":"Say where you're from","items":["Je suis américain","Je viens des États-Unis","Je viens de Géorgie","Tu viens d'où ?","J'habite à Athens","C'est près d'Atlanta","Dans le sud"],"tip":{"h":"Nationality agrees with you","p":"A man says « je suis américain ». A woman says « je suis américaine »; the extra -e makes the n sound. Same with français / française.","x":"Elle est française, il est américain.","xe":"She's French, he's American."},"dlg":[{"s":"Léa","fr":"T'as un petit accent. Tu viens d'où ?","en":"You have a slight accent. Where are you from?"},{"s":"Toi","fr":"Je viens des États-Unis. Je suis américain.","en":"I'm from the United States. I'm American."},{"s":"Léa","fr":"Ah cool ! De quelle ville ?","en":"Oh cool! Which city?"},{"s":"Toi","fr":"J'habite à Athens, en Géorgie. C'est près d'Atlanta.","en":"I live in Athens, Georgia. It's near Atlanta."}]},{"id":"u2l3","t":"Études & travail","goal":"Say what you study and do","items":["Je suis étudiant","J'étudie l'ingénierie","Je suis en dernière année","Tu fais quoi dans la vie ?","Je fais un stage","Je travaille dans l'électronique","Une entreprise"],"tip":{"h":"No « un » before jobs","p":"French drops the article with jobs and studies after « je suis »: je suis étudiant, je suis ingénieur, not « je suis un étudiant ».","x":"Il est ingénieur.","xe":"He's an engineer."},"dlg":[{"s":"Hugo","fr":"Tu fais quoi dans la vie ?","en":"What do you do?"},{"s":"Toi","fr":"Je suis étudiant. J'étudie l'ingénierie.","en":"I'm a student. I study engineering."},{"s":"Hugo","fr":"Et t'es là pour les vacances ?","en":"And you're here on vacation?"},{"s":"Toi","fr":"Non, je fais un stage dans une entreprise d'électronique.","en":"No, I'm doing an internship at an electronics company."}]},{"id":"u2l4","t":"Âge & langues","goal":"Give your age and say what you speak","items":["J'ai vingt et un ans","T'as quel âge ?","Je parle anglais","Je parle un peu français","J'apprends le français","Je suis là pour deux mois"],"tip":{"h":"Age uses « avoir »","p":"In French you HAVE years: j'ai 21 ans (I have 21 years). Never « je suis 21 ».","x":"Elle a vingt-cinq ans.","xe":"She's twenty-five."},"dlg":[{"s":"Léa","fr":"Tu parles bien français !","en":"You speak French well!"},{"s":"Toi","fr":"Merci ! J'apprends le français.","en":"Thanks! I'm learning French."},{"s":"Léa","fr":"T'es là pour combien de temps ?","en":"How long are you here for?"},{"s":"Toi","fr":"Je suis là pour deux mois.","en":"I'm here for two months."}]}]},{"id":"u3","t":"Se faire comprendre","en":"Survive when you're lost for words","lessons":[{"id":"u3l1","t":"Je comprends pas","goal":"Ask people to repeat or slow down","items":["Je comprends pas","J'ai pas compris","Vous pouvez répéter ?","Plus lentement, s'il vous plaît","Pardon ?","Je parle mal français"],"dlg":[{"s":"Serveur","fr":"Vous avez choisi ou je repasse dans cinq minutes ?","en":"Have you chosen or shall I come back in five minutes?"},{"s":"Toi","fr":"Pardon ? J'ai pas compris.","en":"Sorry? I didn't catch that."},{"s":"Serveur","fr":"Vous avez choisi ?","en":"Have you chosen?"},{"s":"Toi","fr":"Ah ! Pas encore, merci.","en":"Ah! Not yet, thanks."}]},{"id":"u3l2","t":"Demander de l'aide","goal":"Get help when words fail you","items":["Vous parlez anglais ?","Comment on dit … en français ?","Ça veut dire quoi ?","Vous pouvez l'écrire ?","Vous pouvez m'aider ?","Je cherche…"],"tip":{"h":"Try French first","p":"Even a clumsy « Excusez-moi, vous parlez anglais ? » gets a much warmer reaction than starting in English. People will often switch to English to help you; you can answer « Je préfère pratiquer mon français » if you want to keep practicing.","x":"Je préfère pratiquer mon français.","xe":"I'd rather practice my French."},"dlg":[{"s":"Toi","fr":"Excusez-moi, vous pouvez m'aider ?","en":"Excuse me, can you help me?"},{"s":"Passant","fr":"Oui, bien sûr.","en":"Yes, of course."},{"s":"Toi","fr":"Comment on dit « charger » en français ?","en":"How do you say « charger » in French?"},{"s":"Passant","fr":"Un chargeur. Vous cherchez un chargeur ?","en":"Un chargeur. You're looking for a charger?"},{"s":"Toi","fr":"Oui, merci beaucoup !","en":"Yes, thank you very much!"}]},{"id":"u3l3","t":"Les questions clés","goal":"Ask who, what, where, when, how","items":["Où ?","Quand ?","Combien ?","Comment ?","Pourquoi ?","Qu'est-ce que c'est ?","Il y a… ?"],"tip":{"h":"Questions by tone","p":"The easiest way to ask a question in spoken French: say a normal sentence and raise your voice at the end. « Tu viens ? » = Are you coming?","x":"Il y a du wifi ?","xe":"Is there wifi?"},"dlg":[{"s":"Toi","fr":"Excusez-moi, il y a une pharmacie près d'ici ?","en":"Excuse me, is there a pharmacy near here?"},{"s":"Passante","fr":"Oui, rue de Rivoli.","en":"Yes, on Rue de Rivoli."},{"s":"Toi","fr":"C'est où, exactement ?","en":"Where is that, exactly?"},{"s":"Passante","fr":"Tout droit, à deux minutes.","en":"Straight ahead, two minutes away."}]}]},{"id":"u4","t":"Les nombres & les prix","en":"Count, pay and understand prices","lessons":[{"id":"u4l1","t":"Un à dix","goal":"Count from 1 to 10","items":["Un","Deux","Trois","Quatre","Cinq","Six","Sept","Huit","Neuf","Dix"],"tip":{"h":"Numbers change sound","p":"Final consonants often go silent before a consonant and link before a vowel: six (seess) → six euros (see-zuh-roh) → six croissants (see kwah-son). Listen more than you read here.","x":"Deux euros, dix euros.","xe":"Two euros, ten euros."}},{"id":"u4l2","t":"Onze à vingt","goal":"Count from 11 to 20","items":["Onze","Douze","Treize","Quatorze","Quinze","Seize","Dix-sept","Dix-huit","Dix-neuf","Vingt"]},{"id":"u4l3","t":"Vingt à soixante-neuf","goal":"Count to 69","items":["Vingt et un","Vingt-cinq","Trente","Quarante","Cinquante","Soixante","Trente-deux"],"tip":{"h":"Pattern up to 69","p":"21, 31, 41, 51, 61 use « et un » (vingt et un). All the others use a hyphen: vingt-deux, trente-cinq, soixante-neuf.","x":"Trente et un, trente-deux.","xe":"Thirty-one, thirty-two."}},{"id":"u4l4","t":"Le piège : 70 à 100","goal":"Crack the 70–99 system","items":["Soixante-dix","Soixante-quinze","Quatre-vingts","Quatre-vingt-cinq","Quatre-vingt-dix","Quatre-vingt-dix-neuf","Cent","Mille"],"tip":{"h":"Do the math","p":"70 = sixty-ten, 80 = four-twenties, 90 = four-twenties-ten. 97 = quatre-vingt-dix-sept = 4×20 + 17. You'll hear these in every price and phone number, so drill them until they're automatic.","x":"Soixante-dix-huit, quatre-vingt-douze.","xe":"Seventy-eight, ninety-two."}},{"id":"u4l5","t":"Les prix","goal":"Ask the price and understand it","items":["C'est combien ?","Ça fait combien ?","Ça fait douze euros","Deux euros cinquante","C'est cher","C'est pas cher","Un billet de vingt"],"tip":{"h":"Saying prices","p":"€4.50 is « quatre euros cinquante ». No « and », no « cents ». You'll also hear « quatre cinquante » for short.","x":"Ça fait sept euros quatre-vingts.","xe":"That's €7.80."},"dlg":[{"s":"Toi","fr":"Bonjour ! C'est combien, la bouteille d'eau ?","en":"Hello! How much is the bottle of water?"},{"s":"Vendeur","fr":"Un euro cinquante.","en":"€1.50."},{"s":"Toi","fr":"Et avec le sandwich, ça fait combien ?","en":"And with the sandwich, how much is that?"},{"s":"Vendeur","fr":"Ça fait six euros quatre-vingts.","en":"That's €6.80."}]}]},{"id":"u5","t":"Au café","en":"Order like a regular","lessons":[{"id":"u5l1","t":"Commander une boisson","goal":"Order a drink","items":["Un café, s'il vous plaît","Je voudrais…","Un café crème","Un thé","Un chocolat chaud","Un jus d'orange","Une bouteille d'eau"],"tip":{"h":"« Un café » is an espresso","p":"Order « un café » and you get a small espresso. For something closer to American coffee ask for « un allongé » (espresso with extra water) or « un café crème ».","x":"Un allongé, s'il vous plaît.","xe":"A long black, please."},"dlg":[{"s":"Serveuse","fr":"Bonjour, qu'est-ce que je vous sers ?","en":"Hello, what can I get you?"},{"s":"Toi","fr":"Bonjour ! Je voudrais un café crème, s'il vous plaît.","en":"Hello! I'd like a café crème, please."},{"s":"Serveuse","fr":"Et pour vous, ce sera tout ?","en":"And for you, will that be all?"},{"s":"Toi","fr":"Oui, merci.","en":"Yes, thanks."}]},{"id":"u5l2","t":"Croissants & co","goal":"Order food and say what you want","items":["Un croissant","Un pain au chocolat","Une tartine","Et avec ceci ?","C'est tout, merci","Sur place ou à emporter ?","À emporter","Sur place"],"dlg":[{"s":"Vendeuse","fr":"Bonjour, monsieur !","en":"Hello, sir!"},{"s":"Toi","fr":"Bonjour ! Un pain au chocolat, s'il vous plaît.","en":"Hello! A pain au chocolat, please."},{"s":"Vendeuse","fr":"Et avec ceci ?","en":"Anything else?"},{"s":"Toi","fr":"Un café aussi.","en":"A coffee too."},{"s":"Vendeuse","fr":"Sur place ou à emporter ?","en":"For here or to go?"},{"s":"Toi","fr":"À emporter. C'est tout, merci.","en":"To go. That's all, thanks."}]},{"id":"u5l3","t":"Payer","goal":"Pay and get the bill","items":["L'addition, s'il vous plaît","Je peux payer par carte ?","Sans contact","En espèces","Gardez la monnaie","Je vous dois combien ?","Le ticket"],"tip":{"h":"The bill won't come by itself","p":"In France the waiter won't bring the check until you ask: lingering is normal and polite. Catch their eye and say « l'addition, s'il vous plaît ». Service is included in the price; leaving a euro or two for good service is a nice extra, not an obligation.","x":"On peut avoir l'addition ?","xe":"Can we have the check?"},"dlg":[{"s":"Toi","fr":"Excusez-moi, l'addition, s'il vous plaît.","en":"Excuse me, the check, please."},{"s":"Serveur","fr":"Bien sûr. Ça fait huit euros quarante.","en":"Of course. That's €8.40."},{"s":"Toi","fr":"Je peux payer par carte ?","en":"Can I pay by card?"},{"s":"Serveur","fr":"Oui, sans contact si vous voulez.","en":"Yes, contactless if you want."},{"s":"Toi","fr":"Parfait. Merci, bonne journée !","en":"Perfect. Thanks, have a good day!"}]}]},{"id":"p1","t":"Ça va vite","en":"How fast French really sounds","lessons":[{"id":"p1l1","t":"Le « je » qui disparaît","goal":"Hear je collapse into ch- and j'","items":["Chuis","Chais pas","Chais plus","J'te dis","J'vais y aller","J'peux pas","J'veux bien"],"tip":{"h":"Where did « je » go?","p":"In fast speech the e in je disappears, and j + s turns into a ch sound: je suis → chuis, je sais → chais. Nobody writes this in an email, but you'll hear it constantly.","x":"Chuis pas sûr.","xe":"I'm not sure."},"dlg":[{"s":"Hugo","fr":"T'es chaud pour ce soir ?","en":"You up for tonight?"},{"s":"Toi","fr":"Chais pas, chuis crevé.","en":"Dunno, I'm wiped."},{"s":"Hugo","fr":"Allez, juste un verre !","en":"Come on, just one drink!"},{"s":"Toi","fr":"Bon, j'veux bien, mais j'rentre tôt.","en":"Okay, sure, but I'm going home early."},{"s":"Hugo","fr":"J'te dis, on rentre à minuit max.","en":"I'm telling you, we'll be home by midnight max."}]},{"id":"p1l2","t":"Tu, il, y a","goal":"Catch t', i' and y a at full speed","items":["T'as vu ?","T'es où ?","I' faut","I' sont où ?","Y en a plus","Y a pas moyen","Qu'est-ce t'as ?"],"tip":{"h":"Tu becomes t'","p":"Before a vowel, tu shrinks to t': t'as, t'es, t'étais. Il and ils often lose their l before a consonant: i' faut, i' sont. And il y a is just « y a ».","x":"T'étais où ?","xe":"Where were you?"},"dlg":[{"s":"Léa","fr":"T'es où ? Le film commence !","en":"Where are you? The movie's starting!"},{"s":"Toi","fr":"J'arrive, chuis dans le métro.","en":"Coming, I'm in the metro."},{"s":"Léa","fr":"I' faut que tu te dépêches, y a plus de places !","en":"You have to hurry, there are no seats left!"},{"s":"Toi","fr":"Y a pas moyen... Qu'est-ce qu'on fait ?","en":"No way... What do we do?"},{"s":"Léa","fr":"Bah, on prend un verre à la place.","en":"Well, we'll get a drink instead."}]},{"id":"p1l3","t":"Les contractions","goal":"Decode fast speech","items":["T'as","T'es","Y a","J'ai pas","C'est pas","On","Ouais"],"tip":{"h":"Spoken French drops « ne »","p":"In speech, « ne » almost always disappears: je sais pas, c'est pas, j'ai pas. « Tu es » becomes « t'es », « il y a » becomes « y a ». And people say « on » instead of « nous ». Write the full forms, but expect to hear these.","x":"On sait pas.","xe":"We don't know."},"dlg":[{"s":"Hugo","fr":"T'es où ?","en":"Where are you?"},{"s":"Toi","fr":"J'suis devant le bar. Y a du monde !","en":"I'm in front of the bar. It's busy!"},{"s":"Hugo","fr":"Ouais, c'est normal le vendredi.","en":"Yeah, that's normal on Fridays."},{"s":"Toi","fr":"On rentre ou pas ?","en":"Are we going in or not?"}]}]},{"id":"u6","t":"Au restaurant","en":"From the table to the check","lessons":[{"id":"u6l1","t":"Réserver & s'installer","goal":"Get a table","items":["Une table pour deux","Vous êtes combien ?","On est trois","J'ai réservé","Au nom de…","En terrasse","À l'intérieur","C'est complet"],"dlg":[{"s":"Serveur","fr":"Bonsoir ! Vous êtes combien ?","en":"Good evening! How many of you are there?"},{"s":"Toi","fr":"Bonsoir, on est deux.","en":"Good evening, there are two of us."},{"s":"Serveur","fr":"En terrasse ou à l'intérieur ?","en":"On the terrace or inside?"},{"s":"Toi","fr":"En terrasse, s'il vous plaît.","en":"On the terrace, please."},{"s":"Serveur","fr":"Très bien, suivez-moi.","en":"Very good, follow me."}]},{"id":"u6l2","t":"Lire la carte","goal":"Understand a French menu","items":["La carte","Le menu","L'entrée","Le plat","Le dessert","Le plat du jour","Une formule"],"tip":{"h":"Entrée = starter","p":"The classic trap: « l'entrée » is the starter, not the main course. The main is « le plat ». And « le menu » is the fixed-price deal; the full list of dishes is « la carte ».","x":"L'entrée, le plat et le dessert.","xe":"Starter, main and dessert."},"dlg":[{"s":"Toi","fr":"Excusez-moi, on peut avoir la carte ?","en":"Excuse me, can we have the menu?"},{"s":"Serveuse","fr":"Voilà. Le plat du jour, c'est un bœuf bourguignon.","en":"Here you go. Today's special is beef bourguignon."},{"s":"Toi","fr":"Il y a une formule le midi ?","en":"Is there a lunch deal?"},{"s":"Serveuse","fr":"Oui, plat et dessert pour seize euros.","en":"Yes, main and dessert for €16."}]},{"id":"u6l3","t":"Commander","goal":"Order your meal","items":["Je vais prendre…","Pour moi, ce sera…","Qu'est-ce que vous recommandez ?","Une carafe d'eau","La cuisson ?","Saignant","À point","Bien cuit"],"tip":{"h":"Ask for « une carafe d'eau »","p":"Tap water is free in restaurants; just ask for une carafe d'eau. If you say « de l'eau », you may get a paid bottle. Steaks run rarer than in the US: « à point » is closer to medium-rare.","x":"Une carafe d'eau, s'il vous plaît.","xe":"A jug of tap water, please."},"dlg":[{"s":"Serveur","fr":"Vous avez choisi ?","en":"Have you decided?"},{"s":"Toi","fr":"Oui. Je vais prendre le steak-frites.","en":"Yes. I'll have the steak and fries."},{"s":"Serveur","fr":"La cuisson ?","en":"How would you like it cooked?"},{"s":"Toi","fr":"À point, s'il vous plaît.","en":"Medium, please."},{"s":"Serveur","fr":"Et comme boisson ?","en":"And to drink?"},{"s":"Toi","fr":"Une carafe d'eau, s'il vous plaît.","en":"A jug of tap water, please."}]},{"id":"u6l4","t":"Pendant & après","goal":"Handle the meal and pay","items":["Bon appétit !","C'était délicieux","Je suis allergique aux…","Sans…","Encore un peu de pain ?","On peut avoir l'addition ?","On partage","Tout s'est bien passé ?"],"dlg":[{"s":"Serveuse","fr":"Tout s'est bien passé ?","en":"Was everything okay?"},{"s":"Toi","fr":"Oui, c'était délicieux, merci.","en":"Yes, it was delicious, thanks."},{"s":"Serveuse","fr":"Un dessert, un café ?","en":"A dessert, a coffee?"},{"s":"Toi","fr":"Non merci. On peut avoir l'addition ?","en":"No thanks. Can we have the check?"},{"s":"Serveuse","fr":"Bien sûr, je vous l'apporte.","en":"Of course, I'll bring it to you."}]}]},{"id":"u7","t":"L'heure & les jours","en":"Time, days and dates","lessons":[{"id":"u7l1","t":"Il est quelle heure ?","goal":"Ask and tell the time","items":["Il est quelle heure ?","Il est trois heures","Et quart","Et demie","Moins le quart","Midi","Minuit"],"dlg":[{"s":"Toi","fr":"Excusez-moi, il est quelle heure ?","en":"Excuse me, what time is it?"},{"s":"Passant","fr":"Il est midi et quart.","en":"It's quarter past twelve."},{"s":"Toi","fr":"Merci ! Le musée ferme à quelle heure ?","en":"Thanks! What time does the museum close?"},{"s":"Passant","fr":"À six heures, je crois.","en":"At six, I think."}]},{"id":"u7l2","t":"L'heure officielle","goal":"Read times, schedules and opening hours","items":["À quelle heure ?","À dix-huit heures","Vingt heures trente","Le matin","L'après-midi","Le soir","C'est ouvert jusqu'à quelle heure ?","En avance / en retard"],"tip":{"h":"France runs on the 24-hour clock","p":"Schedules, tickets and signs use 24h: 14h30 = 2:30 pm, 20h = 8 pm. In conversation people also say « huit heures du soir ».","x":"Le train part à 17h45.","xe":"The train leaves at 5:45 pm."},"dlg":[{"s":"Toi","fr":"Bonjour, vous êtes ouverts jusqu'à quelle heure ?","en":"Hello, until what time are you open?"},{"s":"Vendeuse","fr":"Jusqu'à dix-neuf heures trente.","en":"Until 7:30 pm."},{"s":"Toi","fr":"Et demain matin ?","en":"And tomorrow morning?"},{"s":"Vendeuse","fr":"On ouvre à neuf heures.","en":"We open at nine."}]},{"id":"u7l3","t":"Les jours","goal":"Talk about days and plans","items":["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"],"tip":{"h":"No capital letters","p":"Days and months are lowercase in French: lundi, mai. « Le lundi » means every Monday; « lundi » alone means this Monday.","x":"Le samedi, je joue au foot.","xe":"On Saturdays, I play soccer."}},{"id":"u7l4","t":"Aujourd'hui, demain","goal":"Place things in time","items":["Aujourd'hui","Demain","Hier","Ce soir","Le week-end","La semaine prochaine","Maintenant","Tout de suite"],"dlg":[{"s":"Hugo","fr":"On se voit quand ?","en":"When shall we meet?"},{"s":"Toi","fr":"Demain soir ?","en":"Tomorrow night?"},{"s":"Hugo","fr":"Demain je bosse. Samedi ?","en":"Tomorrow I'm working. Saturday?"},{"s":"Toi","fr":"D'accord, samedi à vingt heures.","en":"Okay, Saturday at 8 pm."}]},{"id":"u7l5","t":"Mois & dates","goal":"Say dates and months","items":["Janvier, février, mars","Avril, mai, juin","Juillet, août","Septembre, octobre","Novembre, décembre","Le premier juin","Le vingt-huit mai","On est le combien ?"],"tip":{"h":"Dates use plain numbers","p":"Only the 1st is special (le premier). Every other date uses the normal number: le deux juin, le quatorze juillet. Days come before months: 28/05 = le vingt-huit mai.","x":"Le quatorze juillet, c'est la fête nationale.","xe":"July 14th is the national holiday."}}]},{"id":"u8","t":"En ville","en":"Find your way around","lessons":[{"id":"u8l1","t":"Où est… ?","goal":"Ask where things are","items":["Où est… ?","C'est loin ?","C'est tout près","À pied","Ici","Là-bas","Près d'ici"],"dlg":[{"s":"Toi","fr":"Excusez-moi, où est la gare ?","en":"Excuse me, where is the train station?"},{"s":"Passante","fr":"La gare de Lyon ?","en":"Gare de Lyon?"},{"s":"Toi","fr":"Oui. C'est loin ?","en":"Yes. Is it far?"},{"s":"Passante","fr":"Non, c'est à dix minutes à pied.","en":"No, it's ten minutes on foot."}]},{"id":"u8l2","t":"Les directions","goal":"Follow directions","items":["Tout droit","À gauche","À droite","Tournez","Au coin de la rue","En face de","Au feu","Prenez la deuxième rue"],"tip":{"h":"Droit vs droite","p":"Tout droit (too drwah) = straight ahead. À droite (ah drwat), with the t sound, = to the right. Listen for that final t.","x":"Tout droit, puis à droite.","xe":"Straight ahead, then right."},"dlg":[{"s":"Toi","fr":"Pardon, je cherche le musée d'Orsay.","en":"Sorry, I'm looking for the Musée d'Orsay."},{"s":"Passant","fr":"Allez tout droit, puis tournez à gauche au feu.","en":"Go straight, then turn left at the light."},{"s":"Toi","fr":"Tout droit, puis à gauche.","en":"Straight, then left."},{"s":"Passant","fr":"Voilà. C'est en face du pont.","en":"That's it. It's across from the bridge."}]},{"id":"u8l3","t":"Les lieux","goal":"Name places in town","items":["La gare","Le musée","Les toilettes","La pharmacie","Le supermarché","Un distributeur","Le centre-ville","La plage"],"tip":{"h":"Au, à la, aux","p":"« à » + le becomes « au », à + les becomes « aux »: je vais au musée, à la gare, aux toilettes.","x":"Je vais au supermarché.","xe":"I'm going to the supermarket."}}]},{"id":"u9","t":"Métro, bus & taxi","en":"Get around the city","lessons":[{"id":"u9l1","t":"Les tickets","goal":"Buy and use tickets","items":["Un ticket","Où est-ce qu'on achète des tickets ?","Le guichet","La borne","Valider","Un pass Navigo","Un contrôleur"],"tip":{"h":"Always validate","p":"Tap or validate your ticket every time you board, even if no one checks. Inspectors fine on the spot (often €35–50), and « je ne savais pas » doesn't work.","x":"Il faut valider à chaque fois.","xe":"You have to validate every time."}},{"id":"u9l2","t":"Prendre le métro","goal":"Ride the metro","items":["La ligne quatre","Direction…","La station","Changer à…","La correspondance","La sortie","Le prochain arrêt"],"tip":{"h":"Lines are named by their last stop","p":"In the Paris metro you follow a line number plus « direction » + the end station. Check the end station before you go down to the platform.","x":"Ligne quatre, direction Mairie de Montrouge.","xe":"Line 4, towards Mairie de Montrouge."},"dlg":[{"s":"Toi","fr":"Pardon, pour aller à la tour Eiffel ?","en":"Sorry, how do I get to the Eiffel Tower?"},{"s":"Agent","fr":"Prenez la ligne six, direction Charles de Gaulle–Étoile.","en":"Take line 6, towards Charles de Gaulle–Étoile."},{"s":"Toi","fr":"Je dois changer ?","en":"Do I have to change?"},{"s":"Agent","fr":"Non, c'est direct. Descendez à Bir-Hakeim.","en":"No, it's direct. Get off at Bir-Hakeim."}]},{"id":"u9l3","t":"Bus, taxi, vélo","goal":"Use other transport","items":["Le bus","L'arrêt de bus","Un taxi","Un Uber","Un vélo","Vous pouvez m'emmener à… ?","Vous pouvez vous arrêter ici"],"dlg":[{"s":"Toi","fr":"Bonjour ! Vous pouvez m'emmener à l'hôtel Lutetia ?","en":"Hello! Can you take me to the Hôtel Lutetia?"},{"s":"Chauffeur","fr":"Bien sûr. C'est à vingt minutes.","en":"Of course. It's twenty minutes away."},{"s":"Toi","fr":"Je peux payer par carte ?","en":"Can I pay by card?"},{"s":"Chauffeur","fr":"Oui, pas de problème.","en":"Yes, no problem."},{"s":"Toi","fr":"Vous pouvez vous arrêter ici, merci.","en":"You can stop here, thanks."}]}]},{"id":"u10","t":"Le train & l'avion","en":"Travel between cities","lessons":[{"id":"u10l1","t":"À la gare","goal":"Take a train","items":["Un billet de train","La voie","Le quai","Le départ","L'arrivée","Un aller simple","Un aller-retour"],"tip":{"h":"Track numbers appear late","p":"Big stations post the « voie » only about 20 minutes before departure. Watch the departures board (« Départs ») and don't head to a platform early.","x":"La voie sera affichée vingt minutes avant.","xe":"The track will be posted twenty minutes before."},"dlg":[{"s":"Toi","fr":"Bonjour, un aller-retour pour Lyon, s'il vous plaît.","en":"Hello, a round trip to Lyon, please."},{"s":"Agent","fr":"Pour quand ?","en":"For when?"},{"s":"Toi","fr":"Pour samedi matin.","en":"For Saturday morning."},{"s":"Agent","fr":"Il y a un train à huit heures. C'est quarante-cinq euros.","en":"There's a train at eight. It's €45."}]},{"id":"u10l2","t":"Dans le train","goal":"Find your seat and handle delays","items":["Voiture douze","Ma place","C'est libre ?","En retard","Annulé","Une grève","Je vais rater ma correspondance"],"tip":{"h":"Strikes happen","p":"Rail and metro strikes (« les grèves ») are announced in advance. Check the SNCF Connect or RATP app the night before, and ask « Il y a une grève ? » if in doubt.","x":"Il y a une grève demain ?","xe":"Is there a strike tomorrow?"},"dlg":[{"s":"Toi","fr":"Excusez-moi, je crois que c'est ma place.","en":"Excuse me, I think this is my seat."},{"s":"Passagère","fr":"Ah pardon ! Voiture douze, place cinquante-trois ?","en":"Oh sorry! Car 12, seat 53?"},{"s":"Toi","fr":"Oui, c'est ça.","en":"Yes, that's right."},{"s":"Passagère","fr":"Désolée, je me suis trompée.","en":"Sorry, I got it wrong."}]},{"id":"u10l3","t":"À l'aéroport","goal":"Get through the airport","items":["L'aéroport","Le vol","Le passeport","La valise","Les bagages","La porte d'embarquement","Ma valise est perdue"],"dlg":[{"s":"Agent","fr":"Bonjour, votre passeport, s'il vous plaît.","en":"Hello, your passport, please."},{"s":"Toi","fr":"Voilà.","en":"Here you go."},{"s":"Agent","fr":"Vous restez combien de temps en France ?","en":"How long are you staying in France?"},{"s":"Toi","fr":"Deux mois. Je fais un stage.","en":"Two months. I'm doing an internship."},{"s":"Agent","fr":"Très bien. Bon séjour !","en":"Very good. Enjoy your stay!"}]}]},{"id":"u11","t":"Le logement","en":"Hotels, Airbnbs and your apartment","lessons":[{"id":"u11l1","t":"Arriver à l'hôtel","goal":"Check in","items":["J'ai une réservation","Pour trois nuits","La chambre","La clé","L'ascenseur","Le petit-déjeuner est compris ?","Au troisième étage"],"tip":{"h":"Floors start at zero","p":"The ground floor is « le rez-de-chaussée » (RDC on elevator buttons). « Le premier étage » is the American second floor.","x":"La réception est au rez-de-chaussée.","xe":"Reception is on the ground floor."},"dlg":[{"s":"Toi","fr":"Bonsoir, j'ai une réservation au nom de LaPrade.","en":"Good evening, I have a reservation under LaPrade."},{"s":"Réceptionniste","fr":"Oui, une chambre pour trois nuits. Voici votre clé.","en":"Yes, a room for three nights. Here's your key."},{"s":"Toi","fr":"Merci. Le petit-déjeuner est compris ?","en":"Thanks. Is breakfast included?"},{"s":"Réceptionniste","fr":"Oui, de sept heures à dix heures.","en":"Yes, from seven to ten."}]},{"id":"u11l2","t":"Questions & problèmes","goal":"Ask for things and report problems","items":["C'est quoi, le code wifi ?","Ça marche pas","Il y a pas d'eau chaude","Une serviette","Je peux laisser mes bagages ?","Le départ est à quelle heure ?","La clim"],"dlg":[{"s":"Toi","fr":"Bonjour, il y a un problème dans ma chambre.","en":"Hello, there's a problem in my room."},{"s":"Réceptionniste","fr":"Qu'est-ce qui se passe ?","en":"What's going on?"},{"s":"Toi","fr":"Il y a pas d'eau chaude.","en":"There's no hot water."},{"s":"Réceptionniste","fr":"Désolé, j'envoie quelqu'un tout de suite.","en":"Sorry, I'll send someone right away."}]},{"id":"u11l3","t":"L'appartement","goal":"Talk about where you live","items":["Un appartement","Un studio","Le loyer","Un colocataire","Le propriétaire","Le digicode","Les poubelles"],"tip":{"h":"The digicode","p":"Most Paris buildings have a keypad door code (« le digicode ») and then an intercom (« l'interphone »). Always ask your host for both.","x":"Quel est le digicode ?","xe":"What's the door code?"},"dlg":[{"s":"Toi","fr":"Bonjour, c'est Zack, le locataire pour l'été.","en":"Hello, it's Zack, the tenant for the summer."},{"s":"Propriétaire","fr":"Ah bonjour ! Le digicode, c'est 4B27.","en":"Oh hello! The door code is 4B27."},{"s":"Toi","fr":"Merci. Et c'est quel étage ?","en":"Thanks. And which floor is it?"},{"s":"Propriétaire","fr":"Cinquième étage, sans ascenseur !","en":"Fifth floor, no elevator!"}]}]},{"id":"u12","t":"Les courses","en":"Bakery, market and supermarket","lessons":[{"id":"u12l1","t":"À la boulangerie","goal":"Buy bread and pastries","items":["Une baguette","Une tradition","Bien cuite","Un sandwich jambon-beurre","Une quiche","Ce sera tout ?","Ce sera tout"],"tip":{"h":"Ask for « une tradi »","p":"« La tradition » (or « une tradi ») is made the old-fashioned way and tastes much better than the plain baguette for a few cents more.","x":"Une tradi, s'il vous plaît.","xe":"A tradi, please."},"dlg":[{"s":"Boulanger","fr":"Bonjour, monsieur ! Qu'est-ce qu'il vous faut ?","en":"Hello, sir! What do you need?"},{"s":"Toi","fr":"Bonjour ! Une tradition et deux croissants, s'il vous plaît.","en":"Hello! A tradition and two croissants, please."},{"s":"Boulanger","fr":"Ce sera tout ?","en":"Will that be all?"},{"s":"Toi","fr":"Oui, ce sera tout. Ça fait combien ?","en":"Yes, that'll be all. How much is it?"},{"s":"Boulanger","fr":"Trois euros vingt.","en":"€3.20."}]},{"id":"u12l2","t":"Au marché","goal":"Buy fruit, vegetables and cheese","items":["Un kilo de…","Cinq cents grammes","Des pommes","Des fraises","Du fromage","Je peux goûter ?","C'est de saison ?"],"tip":{"h":"Du, de la, des = « some »","p":"French needs an article where English says nothing: je voudrais DU fromage, DE LA salade, DES pommes. After a quantity it's just « de »: un kilo DE pommes.","x":"Je mange du pain et des fruits.","xe":"I eat bread and fruit."},"dlg":[{"s":"Marchande","fr":"Bonjour, qu'est-ce que je vous sers ?","en":"Hello, what can I get you?"},{"s":"Toi","fr":"Un kilo de tomates, s'il vous plaît.","en":"A kilo of tomatoes, please."},{"s":"Marchande","fr":"Et avec ceci ?","en":"Anything else?"},{"s":"Toi","fr":"Cinq cents grammes de fraises. Je peux goûter ?","en":"500 grams of strawberries. Can I taste?"},{"s":"Marchande","fr":"Bien sûr, allez-y !","en":"Of course, go ahead!"}]},{"id":"u12l3","t":"Au supermarché","goal":"Shop and check out","items":["Un sac","La caisse","Le rayon","Où est-ce que je trouve… ?","De l'eau gazeuse","De l'eau plate","La carte de fidélité"],"dlg":[{"s":"Caissière","fr":"Bonjour ! Vous avez la carte de fidélité ?","en":"Hello! Do you have the loyalty card?"},{"s":"Toi","fr":"Non, désolé.","en":"No, sorry."},{"s":"Caissière","fr":"Vous voulez un sac ?","en":"Do you want a bag?"},{"s":"Toi","fr":"Oui, s'il vous plaît. Je peux payer par carte ?","en":"Yes, please. Can I pay by card?"},{"s":"Caissière","fr":"Bien sûr, allez-y.","en":"Of course, go ahead."}]}]},{"id":"u13","t":"Le shopping","en":"Clothes, sizes and deciding","lessons":[{"id":"u13l1","t":"Dans un magasin","goal":"Browse and try things on","items":["Je regarde, merci","Je peux l'essayer ?","La cabine d'essayage","Quelle taille ?","C'est trop petit","C'est trop grand","Ça vous va bien"],"dlg":[{"s":"Vendeuse","fr":"Bonjour ! Je peux vous aider ?","en":"Hello! Can I help you?"},{"s":"Toi","fr":"Je regarde, merci.","en":"Just looking, thanks."},{"s":"Toi","fr":"Excusez-moi, je peux essayer ce T-shirt ?","en":"Excuse me, can I try on this T-shirt?"},{"s":"Vendeuse","fr":"Bien sûr, les cabines sont au fond.","en":"Of course, the fitting rooms are at the back."}]},{"id":"u13l2","t":"Choisir & acheter","goal":"Decide and buy","items":["Je le prends","Je vais réfléchir","Vous l'avez en noir ?","C'est en solde ?","Un T-shirt","Un pull","Des chaussures"],"tip":{"h":"Le or la? « It » follows the noun","p":"« Je LE prends » for a masculine thing (le pull), « je LA prends » for a feminine thing (la veste), « je LES prends » for plural (les chaussures).","x":"La veste ? Je la prends !","xe":"The jacket? I'll take it!"},"dlg":[{"s":"Vendeur","fr":"Alors, ça vous va ?","en":"So, does it fit?"},{"s":"Toi","fr":"Oui, mais vous l'avez en noir ?","en":"Yes, but do you have it in black?"},{"s":"Vendeur","fr":"Oui, voilà.","en":"Yes, here you go."},{"s":"Toi","fr":"Parfait, je le prends !","en":"Perfect, I'll take it!"}]}]},{"id":"u14","t":"Faire connaissance","en":"Small talk and making friends","lessons":[{"id":"u14l1","t":"Ce que j'aime","goal":"Talk about what you like","items":["J'adore…","J'aime bien…","J'aime pas…","Tu aimes… ?","Jouer au foot","Faire de la muscu","Les jeux vidéo"],"tip":{"h":"Aimer = love OR like","p":"« J'aime bien » softens to « I like ». Plain « j'aime » with a thing can mean like or love; with a person, « je t'aime » is « I love you », so say « je t'aime bien » for « I like you (as a friend) ».","x":"Je t'aime bien, toi.","xe":"I like you (as a friend)."},"dlg":[{"s":"Léa","fr":"Tu fais quoi pendant ton temps libre ?","en":"What do you do in your free time?"},{"s":"Toi","fr":"J'adore le foot. Je suis fan du PSG.","en":"I love soccer. I'm a PSG fan."},{"s":"Léa","fr":"Ah ouais ? Tu joues aussi ?","en":"Oh yeah? Do you play too?"},{"s":"Toi","fr":"Oui, et je fais de la muscu. Et toi ?","en":"Yes, and I lift. And you?"},{"s":"Léa","fr":"Moi, j'aime bien la musique et le cinéma.","en":"Me, I like music and movies."}]},{"id":"u14l2","t":"Proposer un plan","goal":"Make plans","items":["Tu fais quoi ce week-end ?","Rien de spécial","Ça te dit de… ?","On pourrait…","Avec plaisir !","Je peux pas","Une autre fois"],"dlg":[{"s":"Hugo","fr":"Tu fais quoi ce week-end ?","en":"What are you doing this weekend?"},{"s":"Toi","fr":"Rien de spécial. Pourquoi ?","en":"Nothing special. Why?"},{"s":"Hugo","fr":"Ça te dit de voir le match du PSG au bar ?","en":"Do you feel like watching the PSG game at the bar?"},{"s":"Toi","fr":"Avec plaisir ! C'est à quelle heure ?","en":"I'd love to! What time is it?"},{"s":"Hugo","fr":"À vingt et une heures.","en":"At 9 pm."}]},{"id":"u14l3","t":"Garder le contact","goal":"Swap contacts and say goodbye","items":["T'as Insta ?","Je te donne mon numéro","On s'écrit ?","C'était sympa","À plus tard","À plus !","On se voit demain ?"],"dlg":[{"s":"Léa","fr":"C'était sympa ce soir !","en":"Tonight was fun!"},{"s":"Toi","fr":"Oui, trop bien ! T'as Insta ?","en":"Yeah, so good! Do you have Insta?"},{"s":"Léa","fr":"Oui, je te donne mon pseudo.","en":"Yes, I'll give you my handle."},{"s":"Toi","fr":"Super. On s'écrit pour samedi ?","en":"Great. Shall we text about Saturday?"},{"s":"Léa","fr":"Carrément. À plus !","en":"Definitely. Later!"}]},{"id":"u14l4","t":"La météo","goal":"Talk about the weather","items":["Il fait beau","Il fait chaud","Il fait froid","Il pleut","Il y a du soleil","Il fait vingt-cinq degrés","Il fait quel temps ?"],"tip":{"h":"Weather uses « il fait »","p":"Most weather phrases use « il fait » (it makes): il fait beau, il fait chaud. Temperatures are Celsius: 20° is pleasant, 30° is hot (86°F).","x":"Il fait trente degrés !","xe":"It's thirty degrees!"}}]},{"id":"p2","t":"Entre potes","en":"Talk like friends do","lessons":[{"id":"p2l1","t":"Faire des plans","goal":"Make plans the casual way","items":["On se capte ?","Ça te dit ?","Grave !","Chuis à la bourre","Ça fait un bail !","Vas-y, raconte !","On s'appelle"],"dlg":[{"s":"Hugo","fr":"Eh, ça fait un bail ! Tu deviens quoi ?","en":"Hey, it's been ages! What have you been up to?"},{"s":"Toi","fr":"Ça va, j'bosse beaucoup. Et toi ?","en":"I'm good, I'm working a lot. And you?"},{"s":"Hugo","fr":"Tranquille. On se capte samedi ?","en":"Chill. Shall we meet up Saturday?"},{"s":"Toi","fr":"Grave ! Ça te dit, un apéro au canal ?","en":"Totally! You up for an apéro by the canal?"},{"s":"Hugo","fr":"Carrément. On s'appelle !","en":"Definitely. Talk soon!"}]},{"id":"p2l2","t":"Réagir comme un local","goal":"React fast and naturally","items":["Trop pas","T'abuses !","Mais nan !","Ça m'saoule","C'est chaud","Ça passe","Laisse tomber"],"dlg":[{"s":"Léa","fr":"Tu sais que Hugo part vivre à Montréal ?","en":"You know Hugo's moving to Montreal?"},{"s":"Toi","fr":"Mais nan ! Sérieux ?","en":"No way! Seriously?"},{"s":"Léa","fr":"Si, et il part dans une semaine !","en":"Yes, and he's leaving in a week!"},{"s":"Toi","fr":"T'abuses, il m'a rien dit ! Ça m'saoule.","en":"Come on, he didn't tell me anything! That's annoying."},{"s":"Léa","fr":"Laisse tomber, il le dit à personne.","en":"Forget it, he's not telling anyone."}]},{"id":"p2l3","t":"Les petits mots","goal":"Fillers you'll hear everywhere","items":["Du coup","Genre","En vrai","Bah","Bref","Quoi","Grave"],"dlg":[{"s":"Léa","fr":"Alors, la soirée ?","en":"So, the party?"},{"s":"Toi","fr":"En vrai, c'était cool. Mais genre, très long.","en":"Honestly, it was cool. But like, very long."},{"s":"Léa","fr":"Du coup, t'es rentré à quelle heure ?","en":"So what time did you get home?"},{"s":"Toi","fr":"Bah, trois heures. Bref, je suis crevé.","en":"Well, three o'clock. Anyway, I'm exhausted."}]},{"id":"p2l4","t":"Réactions express","goal":"React like a native","items":["Trop bien !","C'est ouf !","Ça marche","T'inquiète","Sérieux ?","J'avoue","Carrément","N'importe quoi !"],"dlg":[{"s":"Hugo","fr":"J'ai deux places pour le match du PSG.","en":"I have two tickets for the PSG game."},{"s":"Toi","fr":"Sérieux ? C'est ouf !","en":"Seriously? That's crazy!"},{"s":"Hugo","fr":"Tu viens avec moi ?","en":"Are you coming with me?"},{"s":"Toi","fr":"Carrément ! Trop bien !","en":"Definitely! Awesome!"}]}]},{"id":"u15","t":"Sortir le soir","en":"Bars, drinks and nights out","lessons":[{"id":"u15l1","t":"Au bar","goal":"Order drinks and toast","items":["Une bière","Un demi","Une pinte","Un verre de vin rouge","Santé !","C'est ma tournée","L'apéro","L'happy hour"],"tip":{"h":"Look them in the eye","p":"When you clink glasses (« trinquer »), look each person in the eye. Not doing it is said to bring seven years of bad luck, and people do notice.","x":"Santé !","xe":"Cheers!"},"dlg":[{"s":"Barman","fr":"Bonsoir ! Qu'est-ce que je vous sers ?","en":"Good evening! What can I get you?"},{"s":"Toi","fr":"Deux pintes de blonde, s'il vous plaît.","en":"Two pints of lager, please."},{"s":"Barman","fr":"Ça fait quatorze euros.","en":"That's €14."},{"s":"Hugo","fr":"Je paie !","en":"I'll pay!"},{"s":"Toi","fr":"Non, c'est ma tournée. Santé !","en":"No, this round's on me. Cheers!"}]},{"id":"u15l2","t":"En soirée","goal":"Go out and come home","items":["Une soirée","Sortir","Tu viens ?","On va où ?","Une boîte","Il y a du monde","Je rentre","Je suis crevé"],"dlg":[{"s":"Hugo","fr":"On va en boîte après. Tu viens ?","en":"We're going to a club after. Are you coming?"},{"s":"Toi","fr":"C'est où ?","en":"Where is it?"},{"s":"Hugo","fr":"À Pigalle. Il y a du monde le samedi.","en":"In Pigalle. It's busy on Saturdays."},{"s":"Toi","fr":"Désolé, je suis crevé. Je rentre.","en":"Sorry, I'm exhausted. I'm heading home."},{"s":"Hugo","fr":"Dommage ! Une autre fois.","en":"Too bad! Another time."}]}]},{"id":"u16","t":"Santé & urgences","en":"Pharmacy, doctor and emergencies","lessons":[{"id":"u16l1","t":"À la pharmacie","goal":"Describe symptoms and get medicine","items":["J'ai mal à la tête","J'ai mal à la gorge","J'ai mal au ventre","J'ai de la fièvre","Je suis malade","Vous avez quelque chose contre… ?","Un médicament","Du Doliprane"],"tip":{"h":"Pharmacists are your first stop","p":"Look for the green cross. French pharmacists give real advice for minor problems, so describe your symptoms. For Tylenol, ask for « Doliprane » or « du paracétamol »; for Advil, « de l'ibuprofène ».","x":"Je cherche du paracétamol.","xe":"I'm looking for paracetamol."},"dlg":[{"s":"Pharmacienne","fr":"Bonjour, je vous écoute.","en":"Hello, how can I help?"},{"s":"Toi","fr":"Bonjour. J'ai mal à la gorge et j'ai un peu de fièvre.","en":"Hello. I have a sore throat and a slight fever."},{"s":"Pharmacienne","fr":"Depuis quand ?","en":"Since when?"},{"s":"Toi","fr":"Depuis hier. Vous avez quelque chose contre le mal de gorge ?","en":"Since yesterday. Do you have something for a sore throat?"},{"s":"Pharmacienne","fr":"Oui, prenez ces pastilles et du Doliprane.","en":"Yes, take these lozenges and some Doliprane."}]},{"id":"u16l2","t":"Le médecin","goal":"See a doctor","items":["Un médecin","Un rendez-vous","Je suis allergique à…","Ça fait mal ici","Je me suis fait mal","Une ordonnance","Mon assurance"],"dlg":[{"s":"Médecin","fr":"Qu'est-ce qui vous arrive ?","en":"What's the matter?"},{"s":"Toi","fr":"Je me suis fait mal à la cheville au foot.","en":"I hurt my ankle playing soccer."},{"s":"Médecin","fr":"Ça fait mal ici ?","en":"Does it hurt here?"},{"s":"Toi","fr":"Oui, ça fait très mal.","en":"Yes, it hurts a lot."},{"s":"Médecin","fr":"C'est pas cassé. Voici une ordonnance.","en":"It's not broken. Here's a prescription."}]},{"id":"u16l3","t":"Urgences","goal":"Get help in an emergency","items":["Au secours !","Appelez une ambulance !","Appelez la police !","Le cent douze","Les urgences","C'est urgent","Ça va ? Vous êtes blessé ?"],"tip":{"h":"Emergency numbers","p":"112 works everywhere in Europe and connects to English-speaking operators. In France: 15 = ambulance (SAMU), 17 = police, 18 = fire department.","x":"Faites le quinze !","xe":"Dial 15!"}},{"id":"u16l4","t":"Perdu ou volé","goal":"Deal with loss and theft","items":["J'ai perdu mon passeport","On m'a volé mon portefeuille","Mon téléphone","Ma carte bancaire","Le commissariat","L'ambassade américaine","Je suis perdu","Faites attention aux pickpockets"],"dlg":[{"s":"Toi","fr":"Bonjour, on m'a volé mon portefeuille.","en":"Hello, my wallet was stolen."},{"s":"Policier","fr":"Où et quand ?","en":"Where and when?"},{"s":"Toi","fr":"Dans le métro, ligne un, il y a une heure.","en":"In the metro, line 1, an hour ago."},{"s":"Policier","fr":"D'accord. Il y avait quoi dedans ?","en":"Okay. What was inside?"},{"s":"Toi","fr":"Ma carte bancaire et un peu d'argent.","en":"My bank card and a little money."}]}]},{"id":"u17","t":"Les petits problèmes","en":"Phone, wifi and polite complaints","lessons":[{"id":"u17l1","t":"Téléphone & wifi","goal":"Stay connected","items":["J'ai plus de batterie","Vous avez un chargeur ?","Il y a du wifi ?","Le mot de passe","J'ai pas de réseau","Une carte SIM","Une prise"],"tip":{"h":"Bring an adapter","p":"France uses type E plugs (two round pins) at 230 V. Phone and laptop chargers handle the voltage; you just need a plug adapter (« un adaptateur »).","x":"Vous vendez des adaptateurs ?","xe":"Do you sell adapters?"},"dlg":[{"s":"Toi","fr":"Excusez-moi, il y a du wifi ?","en":"Excuse me, is there wifi?"},{"s":"Serveuse","fr":"Oui, le mot de passe est sur le ticket.","en":"Yes, the password is on the receipt."},{"s":"Toi","fr":"Merci. Et je peux charger mon téléphone ? J'ai plus de batterie.","en":"Thanks. And can I charge my phone? My battery is dead."},{"s":"Serveuse","fr":"Il y a une prise là-bas, près de la fenêtre.","en":"There's an outlet over there, by the window."}]},{"id":"u17l2","t":"Se plaindre poliment","goal":"Fix a problem politely","items":["Il y a un problème","C'est pas ce que j'ai commandé","Je crois qu'il y a une erreur","C'est froid","C'est pas grave","Pas de souci","Je suis pressé"],"tip":{"h":"Soften with « je crois que »","p":"French politeness softens complaints. « Je crois qu'il y a une erreur » (I think there's a mistake) gets a much better reaction than « c'est faux » (that's wrong).","x":"Je crois qu'il y a un petit problème.","xe":"I think there's a little problem."},"dlg":[{"s":"Toi","fr":"Excusez-moi, je crois qu'il y a une erreur dans l'addition.","en":"Excuse me, I think there's a mistake in the check."},{"s":"Serveur","fr":"Ah bon ? Laquelle ?","en":"Oh really? Which one?"},{"s":"Toi","fr":"On a pris deux cafés, pas trois.","en":"We had two coffees, not three."},{"s":"Serveur","fr":"Vous avez raison, désolé !","en":"You're right, sorry!"},{"s":"Toi","fr":"Pas de souci, merci.","en":"No worries, thanks."}]}]},{"id":"u18","t":"Raconter","en":"Talk about what you did (passé composé)","lessons":[{"id":"u18l1","t":"Hier, j'ai…","goal":"Say what you did with avoir","items":["J'ai mangé","J'ai visité","J'ai vu","J'ai fait","J'ai bu","Hier soir","T'as fait quoi ?"],"tip":{"h":"The passé composé","p":"Most past actions = avoir + past participle: j'ai mangé, tu as vu, on a fait. Regular -er verbs end in -é (manger → mangé). Many common verbs are irregular: faire → fait, voir → vu, boire → bu, prendre → pris.","x":"On a pris le train.","xe":"We took the train."},"dlg":[{"s":"Hugo","fr":"T'as fait quoi ce week-end ?","en":"What did you do this weekend?"},{"s":"Toi","fr":"J'ai visité le Louvre et j'ai vu la Joconde.","en":"I visited the Louvre and saw the Mona Lisa."},{"s":"Hugo","fr":"Et c'était bien ?","en":"And was it good?"},{"s":"Toi","fr":"Oui, mais il y avait trop de monde !","en":"Yes, but it was way too crowded!"}]},{"id":"u18l2","t":"Je suis allé…","goal":"Movement verbs with être","items":["Je suis allé","Je suis arrivé","Je suis rentré","Je suis sorti","Je suis resté","On est allés","T'es allé où ?"],"tip":{"h":"Être verbs","p":"About 15 verbs of movement and change use être instead of avoir: aller, venir, arriver, partir, sortir, entrer, rentrer, rester, tomber, naître, mourir… The participle then agrees like an adjective: elle est allée, ils sont sortis.","x":"Elle est arrivée ce matin.","xe":"She arrived this morning."},"dlg":[{"s":"Léa","fr":"T'es allé où samedi ?","en":"Where did you go on Saturday?"},{"s":"Toi","fr":"Je suis allé à Versailles avec un collègue.","en":"I went to Versailles with a coworker."},{"s":"Léa","fr":"Trop bien ! T'es rentré tard ?","en":"So cool! Did you get home late?"},{"s":"Toi","fr":"Non, je suis rentré vers huit heures.","en":"No, I got home around eight."}]},{"id":"u18l3","t":"Raconter une journée","goal":"Tell a short story","items":["D'abord","Ensuite","Après","Finalement","C'était génial","C'était nul","Je me suis perdu"],"tip":{"h":"C'était = it was","p":"Use « c'était » (imparfait) to describe or judge something in the past: c'était génial, c'était bizarre. Use the passé composé for the events themselves.","x":"On a mangé là-bas, c'était délicieux.","xe":"We ate there, it was delicious."},"dlg":[{"s":"Hugo","fr":"Alors, ta journée à Montmartre ?","en":"So, your day in Montmartre?"},{"s":"Toi","fr":"D'abord, je me suis perdu !","en":"First, I got lost!"},{"s":"Hugo","fr":"Classique. Et après ?","en":"Classic. And then?"},{"s":"Toi","fr":"Ensuite, j'ai vu le Sacré-Cœur. Finalement, c'était génial.","en":"Then I saw the Sacré-Cœur. In the end, it was great."}]}]},{"id":"u19","t":"Projets & envies","en":"Plans, wants and needs","lessons":[{"id":"u19l1","t":"Je vais…","goal":"Talk about plans (futur proche)","items":["Je vais visiter…","On va manger où ?","Tu vas faire quoi ?","Je vais rester ici","Je pars demain","Peut-être","Je sais pas encore"],"tip":{"h":"Aller + infinitive = future","p":"The easiest future: conjugate aller and add any verb. Je vais manger, tu vas voir, on va partir. This is what people say most in everyday speech.","x":"On va voir !","xe":"We'll see!"},"dlg":[{"s":"Léa","fr":"Tu vas faire quoi ce week-end ?","en":"What are you going to do this weekend?"},{"s":"Toi","fr":"Je vais visiter Lyon.","en":"I'm going to visit Lyon."},{"s":"Léa","fr":"Super ! Tu pars quand ?","en":"Great! When are you leaving?"},{"s":"Toi","fr":"Je pars samedi matin, en train.","en":"I'm leaving Saturday morning, by train."}]},{"id":"u19l2","t":"Envies & besoins","goal":"Say what you want and need","items":["J'ai envie de…","J'ai besoin de…","Je veux…","Je peux… ?","Il faut…","J'ai faim","J'ai soif"],"tip":{"h":"Hunger and thirst use avoir","p":"Like age, you HAVE hunger in French: j'ai faim, j'ai soif, j'ai chaud, j'ai froid. « Je suis chaud » means something very different!","x":"J'ai froid, on rentre ?","xe":"I'm cold, shall we go in?"},"dlg":[{"s":"Toi","fr":"J'ai faim. On mange quelque chose ?","en":"I'm hungry. Shall we eat something?"},{"s":"Hugo","fr":"Oui ! T'as envie de quoi ?","en":"Yes! What do you feel like?"},{"s":"Toi","fr":"J'ai envie d'une crêpe.","en":"I feel like a crêpe."},{"s":"Hugo","fr":"Il faut aller rue du Montparnasse alors.","en":"Then we have to go to Rue du Montparnasse."}]}]},{"id":"p10","t":"Au boulot","en":"Casual office French for your internship","lessons":[{"id":"p10l1","t":"La vie au bureau","goal":"Talk with coworkers at full speed","items":["T'as cinq minutes ?","On fait un point ?","La réu","Je t'envoie un mail","On cale ça quand ?","Je suis en télétravail","On va prendre un café ?","C'est validé"],"tip":{"h":"Tu at work","p":"In most French tech companies and startups, people your age use tu from day one, even with managers. In more traditional companies, wait until someone uses tu with you first.","x":"On peut se tutoyer ?","xe":"Can we use tu?"},"dlg":[{"s":"Manager","fr":"Zack, t'as cinq minutes ?","en":"Zack, got five minutes?"},{"s":"Toi","fr":"Oui, bien sûr.","en":"Yes, of course."},{"s":"Manager","fr":"On fait un point sur la carte avant la réu ?","en":"Shall we catch up on the board before the meeting?"},{"s":"Toi","fr":"Ça marche. J'ai fini les tests ce matin.","en":"Sounds good. I finished the tests this morning."},{"s":"Manager","fr":"Top. Envoie-moi les résultats par mail, et après on va prendre un café.","en":"Great. Email me the results, and then let's grab a coffee."}]},{"id":"p10l2","t":"Les premiers jours","goal":"Introduce yourself at work and ask for help","items":["Je suis le nouveau stagiaire","Tu bosses sur quoi ?","Je bosse sur…","Tu peux me montrer ?","Je m'en occupe","Je suis pas sûr d'avoir compris","On mange ensemble ?","La cantine"],"tip":{"h":"Lunch is a real break","p":"French coworkers usually eat lunch together, often for 45 minutes to an hour, and eating alone at your desk can come across as antisocial in your first weeks. Say yes when they ask.","x":"On mange ensemble ?","xe":"Shall we eat together?"},"dlg":[{"s":"Collègue","fr":"Salut ! T'es le nouveau stagiaire ?","en":"Hi! Are you the new intern?"},{"s":"Toi","fr":"Oui, moi c'est Zack. Je commence aujourd'hui.","en":"Yes, I'm Zack. I start today."},{"s":"Collègue","fr":"Bienvenue ! Moi c'est Inès, je bosse sur les capteurs.","en":"Welcome! I'm Inès, I work on the sensors."},{"s":"Toi","fr":"Enchanté ! Je vais bosser sur la carte de test, je crois.","en":"Nice to meet you! I'm going to work on the test board, I think."},{"s":"Collègue","fr":"Cool. Il est midi, on mange ensemble ?","en":"Cool. It's noon, shall we have lunch together?"},{"s":"Toi","fr":"Avec plaisir !","en":"I'd love to!"}]}]},{"id":"p3","t":"Le tour de France","en":"Regional words from Paris to Marseille","lessons":[{"id":"p3l1","t":"Le parler parisien","goal":"Sound like you live in Paris","items":["Paname","C'est blindé","Métro, boulot, dodo","Une terrasse","Le RER","Ça caille","Râler"],"tip":{"h":"The Paris rhythm","p":"Parisians talk fast and keep it short with strangers. A quick « Bonjour », a short request and « Merci, bonne journée » is the polite version, not the cold one.","x":"Bonjour, un café, merci.","xe":"Hello, a coffee, thanks."},"dlg":[{"s":"Collègue","fr":"Alors, Paname, ça te plaît ?","en":"So, how do you like Paris?"},{"s":"Toi","fr":"Grave, mais le métro c'est blindé !","en":"A lot, but the metro is packed!"},{"s":"Collègue","fr":"Bienvenue ! C'est métro, boulot, dodo ici.","en":"Welcome! It's commute, work, sleep here."},{"s":"Toi","fr":"Et tout le monde râle tout le temps.","en":"And everyone grumbles all the time."},{"s":"Collègue","fr":"C'est normal, on est parisiens !","en":"That's normal, we're Parisians!"}]},{"id":"p3l2","t":"Parler marseillais","goal":"Understand Marseille and Provence","items":["Dégun","Tarpin","Peuchère","Fada","Un minot","Le cagnard","Oh fan !"],"tip":{"h":"The southern accent","p":"In the South people pronounce the e at the end of words (« une bouteilleuh ») and nasal vowels sound like « ang »: « demain » sounds like « demaing ». It's slower and very musical, so it's easier to follow than Paris.","x":"Il fait tarpin chaud.","xe":"It's really hot."},"dlg":[{"s":"Karim","fr":"Oh fan, t'es là ! Ça va ou quoi ?","en":"Oh man, you're here! How's it going?"},{"s":"Toi","fr":"Ça va ! Mais il fait tarpin chaud.","en":"Good! But it's really hot."},{"s":"Karim","fr":"C'est le cagnard, l'ami. Viens, on va à la plage.","en":"That's the southern sun, my friend. Come on, let's go to the beach."},{"s":"Toi","fr":"Y a du monde ?","en":"Is it busy?"},{"s":"Karim","fr":"À cette heure ? Y a dégun !","en":"At this time? There's nobody!"}]},{"id":"p3l3","t":"L'apéro au Sud","goal":"Join in a southern apéro","items":["Un jaune","La pétanque","Tu tires ou tu pointes ?","Adieu !","Avoir le seum","Le mistral","Une cagole"],"dlg":[{"s":"Karim","fr":"Allez, une pétanque avant l'apéro ?","en":"Come on, a game of pétanque before the apéro?"},{"s":"Toi","fr":"D'accord, mais j'sais pas jouer !","en":"Okay, but I don't know how to play!"},{"s":"Karim","fr":"Facile. Tu tires ou tu pointes ?","en":"Easy. Are you shooting or pointing?"},{"s":"Toi","fr":"Euh... je pointe !","en":"Uh... I'm pointing!"},{"s":"Karim","fr":"Raté ! T'as le seum ? Allez, un jaune pour toi.","en":"Missed! You gutted? Come on, a pastis for you."}]},{"id":"p3l4","t":"Le parler lyonnais","goal":"Eat and talk like a Lyonnais","items":["Un gone","Un pélo","Un bouchon","Un pot","Un mâchon","J'y fais","Les traboules"],"dlg":[{"s":"Collègue","fr":"T'as déjà mangé dans un bouchon ?","en":"Have you ever eaten at a bouchon?"},{"s":"Toi","fr":"Non, c'est quoi exactement ?","en":"No, what is it exactly?"},{"s":"Collègue","fr":"Un resto lyonnais, avec un pot de vin et des quenelles.","en":"A Lyon restaurant, with a pot of wine and quenelles."},{"s":"Toi","fr":"Grave, ça me dit !","en":"Totally, I'm in!"},{"s":"Collègue","fr":"Parfait. T'inquiète, j'y réserve.","en":"Perfect. Don't worry, I'll book it."}]},{"id":"p3l5","t":"Le parler du Nord","goal":"Get by in Lille and the North","items":["Biloute","Il drache","Une drache","À tantôt !","Une wassingue","Un petit pain","Je te dis quoi"],"tip":{"h":"« Je te dis quoi »","p":"In the North, « je te dis quoi » means « I'll let you know », not « I tell you what ». The North is famous for its friendliness; people chat easily at the bar.","x":"Je te dis quoi demain.","xe":"I'll let you know tomorrow."},"dlg":[{"s":"Barman","fr":"Salut biloute ! T'es trempé !","en":"Hey buddy! You're soaked!"},{"s":"Toi","fr":"Ouais, il drache dehors !","en":"Yeah, it's pouring outside!"},{"s":"Barman","fr":"Classique à Lille. Une bière pour te réchauffer ?","en":"Classic Lille. A beer to warm you up?"},{"s":"Toi","fr":"Avec plaisir. Et vous servez à manger ?","en":"Gladly. And do you serve food?"},{"s":"Barman","fr":"Des frites, une carbonade... Je te dis quoi quand c'est prêt.","en":"Fries, a carbonade... I'll let you know when it's ready."}]},{"id":"p3l6","t":"Le parler du Sud-Ouest","goal":"Order like a local in the Southwest","items":["Une chocolatine","Une poche","Gavé","Boudu !","Macarel !","Un pitchoun","Le rugby"],"tip":{"h":"The chocolatine war","p":"Paris and most of France say « pain au chocolat »; the Southwest says « chocolatine » and will happily argue about it. Use the local word and you'll get a smile.","x":"Ici, on dit chocolatine !","xe":"Here, we say chocolatine!"},"dlg":[{"s":"Boulangère","fr":"Bonjour ! Et pour vous ?","en":"Hello! And for you?"},{"s":"Toi","fr":"Bonjour, un pain au chocolat, s'il vous plaît.","en":"Hello, a pain au chocolat, please."},{"s":"Boulangère","fr":"Une chocolatine, vous voulez dire !","en":"A chocolatine, you mean!"},{"s":"Toi","fr":"Pardon, une chocolatine !","en":"Sorry, a chocolatine!"},{"s":"Boulangère","fr":"Voilà. Vous voulez une poche ?","en":"Here you go. Do you want a bag?"},{"s":"Toi","fr":"Non merci, c'est gavé bon ici !","en":"No thanks, it's really good here!"}]},{"id":"p3l7","t":"Le parler breton","goal":"Enjoy Brittany like a local","items":["Kenavo !","Yec'hed mat !","Une galette","Une bolée de cidre","Un kouign-amann","Un jus","Il fait beau plusieurs fois par jour"],"dlg":[{"s":"Serveur","fr":"Bonjour ! Vous avez choisi ?","en":"Hello! Have you decided?"},{"s":"Toi","fr":"Oui, une galette complète et une bolée de cidre.","en":"Yes, a galette complète and a bowl of cider."},{"s":"Serveur","fr":"Brut ou doux, le cidre ?","en":"Dry or sweet, the cider?"},{"s":"Toi","fr":"Brut, s'il vous plaît.","en":"Dry, please."},{"s":"Serveur","fr":"Parfait. Et après, un kouign-amann ?","en":"Perfect. And after, a kouign-amann?"},{"s":"Toi","fr":"Ah oui ! Yec'hed mat !","en":"Oh yes! Cheers!"}]},{"id":"p3l8","t":"Le parler de l'Est","goal":"Understand Alsace and Lorraine","items":["Hopla !","Un schlouk","Un sachet","Fermer la lumière","Un escargot","Les bredele","Une flammekueche"],"dlg":[{"s":"Amie","fr":"Hopla, on va au marché de Noël ?","en":"Come on, shall we go to the Christmas market?"},{"s":"Toi","fr":"Avec plaisir ! Il y a quoi à manger ?","en":"Gladly! What's there to eat?"},{"s":"Amie","fr":"Des bredele, du vin chaud, une flammekueche...","en":"Bredele, mulled wine, a flammekueche..."},{"s":"Toi","fr":"Juste un schlouk de vin chaud pour moi.","en":"Just a sip of mulled wine for me."},{"s":"Amie","fr":"Un schlouk ? Allez, prends un verre !","en":"A sip? Come on, have a glass!"}]}]}]},{"id":"argot","t":"Argot du quotidien","sub":"Everyday slang and expressions people really use","units":[{"id":"a-salut","t":"Saluer & répondre","en":"Hi, bye and how it's going","lessons":[{"id":"a-salut-1","t":"Coucou, Wesh, Ça roule","goal":"","items":["Coucou","Wesh","Ça roule","Quoi de neuf","À toute","Bonne continuation","La forme","Tranquille","Nickel"]},{"id":"a-salut-2","t":"Ça baigne, Bof, Pas terrible","goal":"","items":["Ça baigne","Bof","Pas terrible","Bisous","Bises","À la prochaine","Re","Bon courage"]}]},{"id":"a-tic","t":"Les petits mots","en":"Fillers you hear in every sentence","lessons":[{"id":"a-tic-1","t":"En mode, Tu vois, Franchement","goal":"","items":["En mode","Tu vois","Franchement","Trop","Vachement","Ben","Euh"]},{"id":"a-tic-2","t":"Hein, Voilà, Enfin","goal":"","items":["Hein","Voilà","Enfin","C'est clair","Ouais ouais","Mouais","À la limite"]},{"id":"a-tic-3","t":"Attends, Nan mais, Askip","goal":"","items":["Attends","Nan mais","Askip","Grosso modo","À fond","Vas-y","Arrête"]},{"id":"a-tic-4","t":"Nawak, Tellement, N'empêche","goal":"","items":["Nawak","Tellement","N'empêche","Oh là là","Bah ouais","Sans déc","Ah bon ?"]}]},{"id":"a-oral","t":"À l'oral","en":"Short forms and everyday reflexes","lessons":[{"id":"a-oral-1","t":"Y a pas, On y va, On va manger","goal":"","items":["Y a pas","On y va","On va manger","Faut","Faut y aller","Ouaip","Nan","J'me casse"]},{"id":"a-oral-2","t":"T'sais, Qu'est-ce tu fais, Tu fais quoi","goal":"","items":["T'sais","Qu'est-ce tu fais ?","Tu fais quoi ?","C'est qui ?","C'est quoi ?","P'tit","Ptêtre","Allez !"]}]},{"id":"a-expr","t":"Expressions","en":"What people actually say","lessons":[{"id":"a-expr-1","t":"Ça craint, C'est nul, C'est mort","goal":"","items":["Ça craint","C'est nul","C'est mort","Avoir la flemme","Avoir la dalle","Avoir la pêche","En avoir ras-le-bol","Être crevé"]},{"id":"a-expr-2","t":"Être à l'ouest, Être chaud, Péte
