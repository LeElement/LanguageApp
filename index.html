<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Français">
<meta name="description" content="Offline French course for the trip: lessons, spaced review and a phrasebook.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Français Familier</title>
<style>
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500 800;font-display:swap;src:url(fonts/bricolage.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/manrope.woff2) format('woff2')}
:root{
  --bg:#0b0f1d;--bg2:#10162a;--card:#151c31;--card2:#1c2440;--line:rgba(195,203,214,.10);--line2:rgba(195,203,214,.2);
  --ink:#eef1f6;--ink2:#a9b3c6;--ink3:#6e7990;
  --silver:#c3cbd6;--silver2:#e6ebf2;--green:#5ecb92;--green2:#2c6b4e;--greenbg:rgba(94,203,146,.12);
  --amber:#e8b04a;--amberbg:rgba(232,176,74,.13);--blue:#8fb0ff;
  --r:18px;--r2:14px;
  --display:'Bricolage Grotesque',ui-rounded,system-ui,sans-serif;--body:'Manrope',system-ui,-apple-system,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --vvh:100dvh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;margin:0}
svg{display:block}
.hidden{display:none!important}

/* ---------- page shell ---------- */
.page{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 16px calc(var(--safe-b) + 96px)}
.ptitle{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 18px}
.ptitle h1{font-size:30px}
.ptitle .sub{color:var(--ink2);font-size:14px;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);background:var(--card);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.sect{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:26px 4px 10px;font-weight:600}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,15,29,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(var(--safe-b) + 6px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;color:var(--ink3);font-size:11px;font-weight:700;letter-spacing:.02em;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--silver2)}
.tab .dot{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--green);color:#08130d;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 5px}

/* ---------- cards & buttons ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card+.card{margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;font-weight:800;font-size:17px;letter-spacing:.01em;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--silver2);color:#0b0f1d}
.btn.green{background:var(--green);color:#06140d}
.btn.amber{background:var(--amber);color:#1a1204}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line2)}
.btn.link{min-height:44px;color:var(--ink2);font-weight:700;font-size:15px}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.sm{min-height:42px;font-size:15px;border-radius:12px;width:auto;padding:0 16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--card2);color:var(--ink2)}
.pill.green{background:var(--greenbg);color:var(--green)}
.pill.silver{background:rgba(195,203,214,.14);color:var(--silver2)}
.bar{height:8px;border-radius:4px;background:rgba(195,203,214,.12);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .35s}

/* speaker + star */
.spk{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--silver2);background:rgba(195,203,214,.1);transition:background .2s}
.spk svg{width:20px;height:20px}
.spk.big{width:64px;height:64px}
.spk.big svg{width:30px;height:30px}
.spk.noaudio{opacity:.25}
.spk.playing{background:var(--green);color:#06140d}
.spk.slow{width:40px;height:40px;font-size:13px;font-weight:800}
.star{width:36px;height:36px;flex:none;display:grid;place-items:center;color:var(--ink3)}
.star svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}
.star.on{color:#f0c75e}.star.on svg{fill:currentColor}

/* ---------- home ---------- */
.trip{position:relative;overflow:hidden;background:linear-gradient(150deg,#1b2442,#111830 60%);border:1px solid var(--line2)}
.trip .jn{font-family:var(--display);font-size:56px;font-weight:800;line-height:1;letter-spacing:-.02em}
.trip .jn small{font-size:20px;font-weight:700;color:var(--ink2);margin-left:6px;letter-spacing:0}
.trip .tower{position:absolute;right:16px;bottom:0;width:84px;height:168px;opacity:.12;color:var(--silver)}
.trip .tower svg{width:100%;height:100%}
.trip .plan{margin-top:14px;font-size:14px;color:var(--ink2);max-width:80%}
.next .kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.next h2{font-size:24px;margin:6px 0 4px}
.next .goal{color:var(--ink2);margin-bottom:16px}
.week{display:flex;justify-content:space-between;margin-top:12px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink3)}
.week .d i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center}
.week .d i svg{width:15px;height:15px}
.week .d.on i{background:var(--green);border-color:var(--green);color:#06140d}
.week .d.today{color:var(--silver2)}
.week .d.today i{border-color:var(--silver)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 12px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--ink2);font-weight:600}

/* ---------- course ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 6px;padding:2px 16px 8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:19px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-weight:700;font-size:14px;white-space:nowrap}
.chip.on{background:var(--silver2);color:#0b0f1d;border-color:transparent}
.unit{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.unit.cur{border-color:var(--line2)}
.uhead{display:flex;align-items:center;gap:14px;padding:16px;width:100%;text-align:left}
.unum{width:46px;height:46px;flex:none;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;color:var(--silver2)}
.unit.full .unum{background:var(--green);color:#06140d}
.uhead h3{font-size:18px;line-height:1.2}
.uhead .en{font-size:13px;color:var(--ink2);margin-top:2px}
.uhead .bar{margin-top:9px;height:5px}
.chev{width:20px;height:20px;color:var(--ink3);transition:transform .2s;flex:none}
.unit.open .chev{transform:rotate(180deg)}
.lessons{border-top:1px solid var(--line);padding:6px 8px 8px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 8px;border-radius:12px}
.lrow:active{background:var(--card2)}
.lrow.next{background:rgba(195,203,214,.07);box-shadow:inset 0 0 0 1px var(--line2)}
.lnum{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--ink2)}
.lrow.done .lnum{background:var(--green);border-color:var(--green);color:#06140d}
.lrow.next .lnum{border-color:var(--silver);color:var(--silver2)}
.lrow b{display:block;font-size:15.5px;line-height:1.25}
.lrow .g{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.3}
.utest{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;color:var(--ink2);font-weight:700;font-size:14px;border-top:1px dashed var(--line2);margin-top:4px}
.utest svg{width:18px;height:18px}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,5,12,.6);opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88vh;overflow:auto;background:var(--bg2);border-top:1px solid var(--line2);border-radius:24px 24px 0 0;padding:10px 18px calc(var(--safe-b) + 18px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h2{font-size:24px}
.ilist{margin:14px 0 18px}
.irow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow .fr{font-weight:700;font-size:16px}
.irow .ph{font-size:12.5px;color:var(--ink3);font-style:normal}
.irow .en{font-size:14px;color:var(--ink2)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.field label{font-weight:700}
.field .d{font-size:13px;color:var(--ink2);font-weight:500}
.switch{position:relative;width:52px;height:32px;flex:none;border-radius:16px;background:var(--card2);border:1px solid var(--line2);transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink2);transition:transform .2s,background .2s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px);background:#fff}
input[type=date],select.inp,textarea.inp{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--ink)}
textarea.inp{width:100%;min-height:90px;resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,monospace}

/* ---------- session (lesson / review) ---------- */
.sess{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;height:var(--vvh)}
.shead{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 10px) 16px 10px;max-width:600px;width:100%;margin:0 auto}
.shead .bar{flex:1;height:10px;border-radius:5px}
.shead .x{width:40px;height:40px;display:grid;place-items:center;color:var(--ink2);margin-left:-8px}
.shead .x svg{width:24px;height:24px}
.shead .cnt{font-size:13px;font-weight:800;color:var(--ink3);min-width:34px;text-align:right}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sbody .in{max-width:560px;margin:0 auto;padding:12px 18px 24px;min-height:100%;display:flex;flex-direction:column}
.sfoot{max-width:600px;width:100%;margin:0 auto;padding:12px 18px calc(var(--safe-b) + 14px)}
.sfoot.fb-ok{background:var(--greenbg);border-top:1px solid rgba(94,203,146,.25)}
.sfoot.fb-bad{background:var(--amberbg);border-top:1px solid rgba(232,176,74,.25)}
.fbwrap{max-width:600px;margin:0 auto}
.fb{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.fb .ic{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900}
.fb-ok .fb .ic{background:var(--green);color:#06140d}
.fb-bad .fb .ic{background:var(--amber);color:#1a1204}
.fb h4{margin:0;font-family:var(--display);font-size:19px}
.fb-ok .fb h4{color:var(--green)}
.fb-bad .fb h4{color:var(--amber)}
.fb .ans{font-weight:800;font-size:17px;margin-top:2px}
.fb .ansen{color:var(--ink2);font-size:14px}
.fb .note{font-size:13.5px;color:var(--ink2);margin-top:4px}
.kick{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:6px 0 10px}
.qtitle{font-family:var(--display);font-size:22px;font-weight:700;margin:0 0 18px;line-height:1.25}
.prompt{font-size:26px;font-weight:800;line-height:1.25;margin:6px 0 4px}
.prompt.fr{font-family:var(--body)}
.promptsub{color:var(--ink2);font-size:15px}
.newcard{margin:auto 0;text-align:center;padding:10px 0}
.newcard .fr{font-size:34px;font-weight:800;line-height:1.2;margin:18px 0 6px;letter-spacing:-.01em}
.newcard .ph{color:var(--ink3);font-size:15px;margin-bottom:12px}
.newcard .en{font-size:19px;color:var(--ink2);font-weight:600}
.excard{margin-top:28px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 14px 14px 16px;display:flex;gap:12px;align-items:center}
.excard .xf{font-weight:700}
.excard .xe{font-size:14px;color:var(--ink2)}
.opts{display:grid;gap:10px;margin-top:auto}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;text-align:left;padding:12px 16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line2);font-weight:700;font-size:16.5px;line-height:1.3;transition:border-color .15s,background .15s}
.opt:active{background:var(--card2)}
.opt.ok{border-color:var(--green);background:var(--greenbg)}
.opt.bad{border-color:var(--amber);background:var(--amberbg)}
.opt.dim{opacity:.45}
.opt .k{width:26px;height:26px;flex:none;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;color:var(--ink3)}
.listenbox{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 26px}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.match .col{display:grid;gap:10px;align-content:start}
.mbtn{min-height:62px;padding:10px 12px;border-radius:14px;background:var(--card);border:1.5px solid var(--line2);font-weight:700;font-size:15px;line-height:1.25;text-align:center;transition:all .15s}
.mbtn.sel{border-color:var(--silver);background:var(--card2)}
.mbtn.ok{border-color:transparent;background:var(--greenbg);color:var(--green);opacity:.55;pointer-events:none}
.mbtn.bad{border-color:var(--amber);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* build */
.answerline{min-height:118px;border-bottom:2px solid var(--line2);display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:8px 0 12px;margin-bottom:22px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:auto;margin-bottom:6px}
.tile{padding:10px 14px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line2);border-bottom-width:3px;font-weight:700;font-size:17px}
.tile.used{visibility:hidden}
/* type */
.typein{width:100%;background:var(--card);border:1.5px solid var(--line2);border-radius:16px;padding:16px;font-size:19px;font-weight:600;outline:none;color:var(--ink)}
.typein:focus{border-color:var(--silver)}
.accents{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.accents button{min-width:40px;height:40px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);font-weight:700;font-size:17px}
/* gap */
.gapq{font-size:22px;font-weight:700;line-height:1.4;margin:4px 0 6px}
.gapq u{text-decoration:none;display:inline-block;min-width:90px;border-bottom:2.5px solid var(--silver);color:var(--silver2)}
/* dialogue */
.chat{display:flex;flex-direction:column;gap:10px;margin:6px 0 16px}
.bub{max-width:86%;padding:11px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);animation:pop .25s ease-out;cursor:pointer}
.bub.me{align-self:flex-end;background:#22304f;border-color:transparent;border-bottom-right-radius:6px}
.bub.them{border-bottom-left-radius:6px}
.bub .who{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.bub .t{font-weight:700;font-size:16.5px}
.bub .tr{font-size:13.5px;color:var(--ink2);margin-top:3px}
.bub.playing{box-shadow:0 0 0 2px var(--green)}
.bub.blank{border:1.5px dashed var(--line2);background:transparent;color:var(--ink3)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.hideTr .bub .tr{display:none}
/* tip */
.tipcard{background:linear-gradient(160deg,#1a2240,#141b31);border:1px solid var(--line2);border-radius:var(--r);padding:20px;margin:auto 0}
.tipcard .lab{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--silver)}
.tipcard h3{font-size:22px;margin:10px 0 10px}
.tipcard p{color:var(--ink2);margin:0 0 14px;font-size:16px}
/* speak */
.mic{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--silver2);color:#0b0f1d;margin:0 auto}
.mic svg{width:36px;height:36px}
.mic.on{background:var(--green);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(94,203,146,.18)}}
.heard{text-align:center;margin-top:14px;min-height:44px;color:var(--ink2)}
/* done */
.donebox{text-align:center;margin:auto 0;padding:20px 0}
.donebox .tick{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:var(--green);color:#06140d;display:grid;place-items:center;animation:pop .4s}
.donebox .tick svg{width:50px;height:50px}
.donebox h2{font-size:30px}
.donebox .dsub{color:var(--ink2);margin:6px 0 22px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 20px}
.cando{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;text-align:left;color:var(--ink2);font-size:15px}
.cando b{color:var(--ink)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}

/* ---------- review & guide ---------- */
.big{font-family:var(--display);font-size:46px;font-weight:800;line-height:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;height:38px;border-radius:10px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 0 var(--line2)}
.strength{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(195,203,214,.1);margin:12px 0 10px}
.strength i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--ink2)}
.legend b{display:block;font-size:17px;color:var(--ink);font-family:var(--display)}
.legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.plabel{font-size:12.5px;font-weight:700;color:var(--ink2);margin:0 0 10px}
.idk{display:block;margin:10px auto 0;color:var(--ink2)}
.card.place{position:relative;margin-bottom:12px}
.card.place .pic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--silver2);flex:none}
.card.place .pic svg{width:20px;height:20px}
.card.place b{display:block;font-size:16.5px;padding-right:22px}
.pclose{position:absolute;top:10px;right:10px;width:30px;height:30px;display:grid;place-items:center;color:var(--ink2);border-radius:10px}
.pclose svg{width:16px;height:16px}
.presult{text-align:center;padding:6px 0 4px}
.presult h2{font-size:28px;margin:0}
.presult .tick{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--green);color:#06140d;display:grid;place-items:center}
.presult .tick svg{width:34px;height:34px}
.presult .dsub{color:var(--ink2);margin-top:6px;font-size:15px}
.plist{margin:0 0 8px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow b{display:block;font-size:15px;line-height:1.25}
.prow .grow>span{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.pst{width:12px;height:12px;border-radius:50%;flex:none;background:#5a6275}
.pst.known{background:var(--green)}
.pst.mostly{background:#a8e6c6}
.pst.some{background:var(--silver)}
.pst.unchecked{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.pskip{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.pskip small{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.listbtn.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.listbtn.on .ic{background:var(--greenbg);color:var(--green)}
.bub .cue{font-weight:700;color:var(--ink)}
.bub .cue2{font-size:13px;color:var(--ink2);margin-top:4px}
.bub .alts{font-size:13px;color:var(--ink2);margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.rolemic{display:flex;flex-direction:column;align-items:center;margin:6px 0 4px}
.rolemic .heard{margin-top:8px;min-height:0}
.mic.sm{width:64px;height:64px}
.mic.sm svg{width:26px;height:26px}
.mic.on{background:var(--green)}
.btn.pulse{box-shadow:0 0 0 3px rgba(94,203,146,.35)}
.earopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.opt.earopt{flex-direction:column;justify-content:center;text-align:center;min-height:124px;gap:6px;padding:14px 10px}
.earopt b{font-family:var(--display);font-size:21px;line-height:1.2}
.earopt span{font-size:13px;color:var(--ink2);font-weight:600}
.pairrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pside{display:flex;align-items:center;gap:10px;min-width:0}
.pside b{display:block;font-size:15px}
.pside span{display:block;font-size:12.5px;color:var(--ink2)}
.hfcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 20px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:12px;margin-top:6px}
.hftop{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.25}
.hftop.fr{color:var(--ink)}
.hfbot{font-size:23px;font-weight:700;color:var(--green);min-height:30px;line-height:1.25}
.hfbot.en{color:var(--ink2);font-size:19px}
.hfphase{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.hfphase.go{color:var(--amber)}
.hfrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.hfrow b{display:block;font-size:15.5px}
.hfrow .grow>span{display:block;font-size:13px;color:var(--ink2)}
.hfmark{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:9px;border:1px solid var(--line2);color:var(--ink3);flex:none}
.hfrow.on .hfmark{background:rgba(232,176,74,.16);border-color:var(--amber);color:var(--amber)}
.listbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:10px}
.listbtn .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--silver2);flex:none}
.listbtn .ic svg{width:20px;height:20px}
.listbtn b{display:block}
.listbtn span{font-size:13px;color:var(--ink2)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:0 14px;margin-bottom:12px}
.search svg{width:18px;height:18px;color:var(--ink3);flex:none}
.search input{flex:1;background:none;border:0;outline:none;height:48px;font-size:16px}
.grp{margin-bottom:10px}
.grp>button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-weight:700}
.grp>button span{font-size:12px;color:var(--ink3);font-weight:700}
.grp .body{padding:2px 12px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:10px;overflow:hidden}
.acc>button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px}
.acc>button b{display:block;font-size:16px}
.acc>button span{display:block;font-size:13px;color:var(--ink2)}
.acc .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.acc h4{margin:14px 0 4px;font-size:15px}
.acc p{margin:0 0 6px;color:var(--ink2);font-size:14.5px}
.exrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.exrow .spk{width:34px;height:34px}
.exrow .spk svg{width:16px;height:16px}
.exrow .t{font-weight:600;font-size:15px}
.vtable{width:100%;border-collapse:collapse;margin-top:8px}
.vtable td{padding:9px 4px;border-bottom:1px solid var(--line);font-size:16px}
.vtable td:last-child{width:44px}
.vtable .spk{width:34px;height:34px}
.vtable .spk svg{width:16px;height:16px}
.reg{border-left:3px solid var(--c);padding-left:14px;margin:14px 0}
.ok-ex{color:var(--green)}.no-ex{color:var(--amber);text-decoration:line-through;text-decoration-thickness:1px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translateX(-50%);z-index:80;background:var(--silver2);color:#0b0f1d;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:pop .2s}
.empty{text-align:center;color:var(--ink2);padding:30px 10px}

/* shadowing */
.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 -18px 10px;padding:6px 18px 8px;position:sticky;top:0;z-index:3;background:var(--bg)}
.rounds button{padding:8px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink3);line-height:1.2}
.rounds button b{display:block;font-size:15px;color:var(--ink2);font-family:var(--display)}
.rounds button.on{border-color:var(--silver);color:var(--ink)}
.rounds button.on b{color:var(--silver2)}
.rounds button.done b{color:var(--green)}
.shhint{font-size:14px;color:var(--ink2);margin:0 0 12px;min-height:40px}
.shline{opacity:.45;transition:opacity .2s}
.shline.cur{opacity:1}
.shline.cur .bub{box-shadow:0 0 0 2px var(--silver)}
.shline.turn .bub{box-shadow:0 0 0 2px var(--green)}
.memo .t{filter:blur(7px);user-select:none}
.memo .bub.reveal .t{filter:none}
.turnbar{height:6px;border-radius:3px;background:rgba(195,203,214,.12);overflow:hidden;margin:4px 0 14px}
.turnbar i{display:block;height:100%;width:0;background:var(--green)}
.shctl{display:flex;align-items:center;justify-content:center;gap:18px}
.shctl .c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--ink)}
.shctl .c svg{width:20px;height:20px}
.shctl .main{width:68px;height:68px;background:var(--silver2);color:#0b0f1d}
.shctl .main svg{width:28px;height:28px}
.shopts{display:flex;justify-content:center;gap:8px;margin-top:12px}
.shopts button{height:34px;padding:0 12px;border-radius:17px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2)}
.shopts button.on{background:var(--greenbg);border-color:rgba(94,203,146,.4);color:var(--green)}
@media (min-width:700px){.page{padding-top:40px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
